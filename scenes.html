<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>心をつなぐ英語表現 - 気持ちから探す</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="common.css?v=23">
</head>
<body>
  <header>
    <a href="index.html" class="logo">心をつなぐ英語表現</a>
    <span id="streakBadge" class="streak-badge">🔥 0日連続学習</span>
  </header>
  <div class="subnav">
    <a href="plan.html">📅 予習</a>
    <a href="roleplay.html">🎭 ロール</a>
    <a href="letter.html">💌 手紙</a>
    <a href="mylist.html">🗒 リスト</a>
    <a href="scenes.html" class="active" aria-current="page">💞 気持ち</a>
  </div>
  <div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="気持ちや場面を日本語で（例: 寂しい、謝りたい）" aria-label="気持ちや場面を検索" autocomplete="off">
    <div class="chip-row" id="sceneChips"></div>
    <div class="chip-row" id="toneChips" role="group" aria-label="言い方のトーン">
      <button class="chip active" data-tone="all">すべての言い方</button>
      <button class="chip" data-tone="c">😄 カジュアル</button>
      <button class="chip" data-tone="g">🤍 やさしく</button>
      <button class="chip" data-tone="s">💞 真剣に</button>
    </div>
    <div id="results"></div>
  </div>

  <nav>
    <a href="index.html">🏠 ホーム</a>
    <a href="translator.html">💬 会話</a>
    <a href="plan.html" class="active" aria-current="page">📅 予習</a>
    <a href="recap.html">📝 ふり返り</a>
    <a href="quiz.html">✍️ 練習</a>
  </nav>
  <script src="common.js?v=43"></script>
  <script src="content.js?v=8"></script>
  <script>
    // tone: c=カジュアル / g=やさしく / s=真剣に
    const SCENES = CONTENT.SCENES;
    const TONE_LABEL = { c: 'カジュアル', g: 'やさしく', s: '真剣に' };
    let activeScene = null, tone = 'all', query = '';

    // ひらがな/カタカナ・全半角のゆれを吸収
    function norm(s) {
      return String(s || '').normalize('NFKC').toLowerCase().replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
    }
    function toast(msg) {
      let el = document.getElementById('toast');
      if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
      el.textContent = msg; el.classList.add('show');
      clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function sceneMatches(sc, q) {
      if (!q) return false;
      return norm(sc.label).includes(q) || sc.kw.some(k => { const nk = norm(k); return q.includes(nk) || nk.includes(q); });
    }

    function card(en, ja, toneKey) {
      const c = document.createElement('div');
      c.className = 'phrase-card';
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; justify-content:space-between; align-items:flex-start; gap:8px;';
      const left = document.createElement('div');
      const e = document.createElement('div'); e.className = 'en-text'; e.textContent = en;
      if (toneKey) { const t = document.createElement('span'); t.className = 'tone-badge tone-' + toneKey; t.textContent = TONE_LABEL[toneKey]; e.appendChild(t); }
      const j = document.createElement('div'); j.className = 'ja-text'; j.textContent = ja;
      left.appendChild(e); left.appendChild(j);
      const act = document.createElement('div'); act.style.cssText = 'display:flex; flex-shrink:0;';
      const play = document.createElement('button'); play.className = 'icon-btn'; play.textContent = '🔊'; play.setAttribute('aria-label', '再生');
      play.addEventListener('click', () => EA.speak(en, 'en-US', 1.0));
      const slow = document.createElement('button'); slow.className = 'icon-btn'; slow.textContent = '🐢'; slow.setAttribute('aria-label', 'ゆっくり再生');
      slow.addEventListener('click', () => EA.speak(en, 'en-US', 0.7));
      const save = document.createElement('button'); save.className = 'icon-btn'; save.setAttribute('aria-label', 'マイ単語に保存');
      const saved = EA.hasPhrase(en);
      save.textContent = saved ? '✅' : '💾'; if (saved) save.classList.add('done');
      save.addEventListener('click', () => {
        const r = EA.addCustomPhrase(en, ja);
        if (r.added) { save.textContent = '✅'; save.classList.add('done'); toast('マイ単語に保存しました（クイズ・発音でも出題されます）'); }
        else toast(r.reason === 'exists' ? 'すでに保存されています' : '保存できませんでした');
      });
      const pin = document.createElement('button'); pin.className = 'icon-btn'; pin.textContent = EA.isPinned(en) ? '📌' : '📍'; pin.setAttribute('aria-label', 'ピン留め');
      pin.addEventListener('click', () => { const on = EA.togglePin(en, ja); pin.textContent = on ? '📌' : '📍'; toast(on ? 'ピン留めしました（会話画面から開けます）' : 'ピン留めを外しました'); });
      act.appendChild(play); act.appendChild(slow); act.appendChild(pin); act.appendChild(save);
      row.appendChild(left); row.appendChild(act);
      c.appendChild(row);
      const kana = document.createElement('div'); kana.className = 'kana-line'; EA.renderKana(kana, en); c.appendChild(kana);
      return c;
    }

    function title(text) { const d = document.createElement('div'); d.className = 'section-title'; d.textContent = text; return d; }

    function render() {
      const box = document.getElementById('results');
      box.innerHTML = '';
      const q = norm(query.trim());
      let scenes = [];
      if (activeScene) scenes = SCENES.filter(s => s.id === activeScene);
      else if (q) scenes = SCENES.filter(s => sceneMatches(s, q));

      // 場面ごとの定型フレーズ
      let shown = 0;
      scenes.forEach(sc => {
        const items = sc.p.filter(p => tone === 'all' || p[2] === tone);
        if (!items.length) return;
        box.appendChild(title(sc.emoji + ' ' + sc.label));
        items.forEach(p => { box.appendChild(card(p[0], p[1], p[2])); shown++; });
      });

      // 日本語/英語のフリーワード検索（場面フレーズ＋表現集＋マイ単語）
      if (q) {
        const have = new Set(scenes.flatMap(s => s.p.map(p => p[0].toLowerCase())));
        const extra = [];
        SCENES.forEach(sc => sc.p.forEach(p => {
          if (have.has(p[0].toLowerCase())) return;
          if ((tone === 'all' || p[2] === tone) && (norm(p[1]).includes(q) || p[0].toLowerCase().includes(q))) extra.push([p[0], p[1], p[2]]);
        }));
        Object.values(CONTENT.MEET).forEach(m => m.p.forEach(p => {
          if (have.has(p[0].toLowerCase()) || extra.some(x => x[0].toLowerCase() === p[0].toLowerCase())) return;
          if (tone === 'all' && (norm(p[1]).includes(q) || p[0].toLowerCase().includes(q))) extra.push([p[0], p[1], null]);
        }));
        EA.getAllPhrases().forEach(p => {
          if (have.has(p[1].toLowerCase()) || extra.some(x => x[0].toLowerCase() === p[1].toLowerCase())) return;
          if (tone === 'all' && (norm(p[2]).includes(q) || p[1].toLowerCase().includes(q))) extra.push([p[1], p[2], null]);
        });
        if (extra.length) {
          box.appendChild(title('🔎 「' + query.trim() + '」に関連する表現'));
          extra.slice(0, 30).forEach(x => { box.appendChild(card(x[0], x[1], x[2])); shown++; });
        }
      }

      if (!shown) {
        const d = document.createElement('div');
        d.className = 'chat-empty';
        d.innerHTML = (q || activeScene) ? '見つかりませんでした。別の言葉（例: 寂しい・ありがとう・心配）でも試してみてください。'
          : '上の「気持ち」を選ぶか、言いたいことを日本語で検索してください。<br>同じ気持ちでも 😄カジュアル／🤍やさしく／💞真剣に の言い方を選べます。';
        box.appendChild(d);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const chips = document.getElementById('sceneChips');
      SCENES.forEach(sc => {
        const b = document.createElement('button');
        b.className = 'chip'; b.textContent = sc.emoji + ' ' + sc.label; b.dataset.id = sc.id;
        b.addEventListener('click', () => {
          const was = activeScene === sc.id;
          activeScene = was ? null : sc.id;
          chips.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x.dataset.id === activeScene));
          document.getElementById('searchInput').value = ''; query = '';
          render();
        });
        chips.appendChild(b);
      });
      document.getElementById('searchInput').addEventListener('input', e => {
        query = e.target.value; activeScene = null;
        chips.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
        render();
      });
      document.querySelectorAll('#toneChips .chip').forEach(c => c.addEventListener('click', () => {
        document.querySelectorAll('#toneChips .chip').forEach(x => x.classList.remove('active'));
        c.classList.add('active'); tone = c.dataset.tone; render();
      }));
      render();
    });

  </script>
</body>
</html>
