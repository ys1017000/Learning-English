<body>

  <div class="subnav">

    <a href="phrases.html">📚 表現集</a>
  </div>
  <div class="container">
    <div class="card">
      <h2 style="color:#d97706;">➕ 単語・フレーズの追加と辞書自動検索</h2>
      <p class="muted" style="margin-bottom:1rem;">覚えたい単語を入力して「辞書から自動検索」を押すと、意味や例文が自動で入力されます。</p>
      <div style="margin-bottom:1rem;">
        <label for="inputWord" style="font-size:0.8rem; font-weight:bold; color:var(--text-muted);">追加する単語・英語フレーズ:</label>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <input type="text" id="inputWord" placeholder="例: resilience, confession..." autocapitalize="none" autocorrect="off" spellcheck="false" style="margin-bottom:0; flex:1;">
          <button class="btn" id="autoSearchBtn" style="background:#d97706; width:auto; padding:0 1rem; font-size:0.85rem; white-space:nowrap;">🌐 辞書から自動検索</button>
        </div>
      </div>
      <div class="status-msg" id="searchStatus" role="status"></div>
      <div style="margin:1rem 0;">
        <label for="inputMeaning" style="font-size:0.8rem; font-weight:bold; color:var(--text-muted);">意味・日本語訳:</label>
        <input type="text" id="inputMeaning" placeholder="例: 告白、自白、打ち明け話" style="margin-top:4px; margin-bottom:0;">
      </div>
      <div style="margin-bottom:1.25rem;">
        <label for="inputExample" style="font-size:0.8rem; font-weight:bold; color:var(--text-muted);">例文・補足情報 (任意):</label>
        <input type="text" id="inputExample" placeholder="例: She made a full confession." style="margin-top:4px; margin-bottom:0;">
      </div>
      <button class="btn" id="saveCustomBtn" style="background:#d97706;">💾 マイ単語帳に保存して追加する</button>
    </div>
    <div class="card">
      <h2>📚 追加したマイ単語一覧</h2>
      <div id="customListContainer"></div>
    </div>
  </div>

  <nav>
    <a href="index.html">🏠 ホーム</a>
    <a href="translator.html">💬 会話</a>
    <a href="plan.html">📅 予習</a>
    <a href="recap.html">📝 ふり返り</a>
    <a href="quiz.html" class="active" aria-current="page">✍️ 練習</a>
  </nav>
  <script src="common.js?v=8"></script>
  <script>
    const JP_CHAR = /[\u3040-\u30ff\u3400-\u9fff]/;

    function setStatus(type, msg) {
      const el = document.getElementById('searchStatus');
      el.className = 'status-msg ' + type;
      el.textContent = msg;
    }
    function hideStatus() { document.getElementById('searchStatus').className = 'status-msg'; }

    function renderCustomList() {
      const container = document.getElementById('customListContainer');
      const customs = EA.getCustomPhrases();
      container.innerHTML = '';
      if (customs.length === 0) {
        container.innerHTML = '<div class="muted" style="text-align:center; padding:1rem;">まだ追加された単語はありません。</div>';
        return;
      }
      customs.forEach((item, index) => {
        const card = document.createElement('div');
        card.style.cssText = 'background:#f8fafc; border:1px solid var(--border); border-radius:8px; padding:0.75rem; margin-bottom:0.5rem; display:flex; justify-content:space-between; align-items:center; gap:8px;';
        const info = document.createElement('div');
        info.innerHTML = '<div style="font-weight:bold; color:var(--primary);">' + EA.esc(item[1]) + '</div>' +
          '<div style="font-size:0.85rem;">' + EA.esc(item[2]) + '</div>' +
          (item[3] ? '<div style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;">例文: ' + EA.esc(item[3]) + '</div>' : '');
        const del = document.createElement('button');
        del.textContent = '削除';
        del.style.cssText = 'background:#fee2e2; color:#b91c1c; border:none; padding:6px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer; flex-shrink:0;';
        del.addEventListener('click', () => {
          if (!confirm('「' + item[1] + '」を削除しますか？')) return;
          // 並び順が変わっていても正しく消せるよう、英文で特定する
          const list = EA.getCustomPhrases();
          const i = list.findIndex(p => p[1] === item[1]);
          if (i >= 0) { list.splice(i, 1); EA.saveCustomPhrases(list); }
          renderCustomList();
        });
        card.appendChild(info);
        card.appendChild(del);
        container.appendChild(card);
      });
    }

    async function fetchJson(url) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) { return null; } finally { clearTimeout(timer); }
    }
    function decodeEntities(s) { return new DOMParser().parseFromString(String(s), 'text/html').documentElement.textContent || ''; }
    async function toJapanese(text) {
      const data = await fetchJson('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|ja');
      if (data && Number(data.responseStatus) === 200 && data.responseData && data.responseData.translatedText) {
        return decodeEntities(data.responseData.translatedText);
      }
      return '';
    }

    async function lookupDictionary(word) {
      if (JP_CHAR.test(word)) { setStatus('error', '❌ 英語の単語・フレーズを入力してください。日本語の意味は下の欄に入力します。'); return; }
      const btn = document.getElementById('autoSearchBtn');
      btn.disabled = true;
      setStatus('info', '🌐 辞書を検索中...');
      try {
        // 英英辞書（定義・例文）と翻訳（日本語の意味）を同時に取得
        const [dict, jaWord] = await Promise.all([
          fetchJson('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word)),
          toJapanese(word)
        ]);
        let enDef = '', enEx = '';
        if (Array.isArray(dict)) {
          outer: for (const entry of dict) {
            for (const m of (entry.meanings || [])) {
              for (const d of (m.definitions || [])) {
                if (!enDef && d.definition) enDef = d.definition;
                if (d.example) { enEx = d.example; break outer; }
              }
            }
          }
        }
        let meaning = jaWord && jaWord.toLowerCase() !== word.toLowerCase() ? jaWord : '';
        if (!meaning && enDef) meaning = await toJapanese(enDef);   // 単語訳が取れないときは定義を翻訳
        const example = enEx || (enDef ? 'Definition: ' + enDef : '');

        if (!meaning && !example) { setStatus('error', '❌ 見つかりませんでした。意味を手動で入力してください。'); return; }
        if (meaning) document.getElementById('inputMeaning').value = meaning;
        if (example) document.getElementById('inputExample').value = example;
        setStatus('ok', enEx ? '✅ 意味と例文を自動入力しました。内容を確認して保存してください。'
          : '✅ 自動入力しました（例文は見つからなかったため英語の定義を入れています）。必要に応じて修正してください。');
      } finally { btn.disabled = false; }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCustomList();
      const wordInput = document.getElementById('inputWord');
      const search = () => {
        const word = wordInput.value.trim();
        if (!word) { setStatus('error', '検索する単語を入力してください。'); return; }
        lookupDictionary(word);
      };
      document.getElementById('autoSearchBtn').addEventListener('click', search);
      wordInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); search(); } });

      document.getElementById('saveCustomBtn').addEventListener('click', () => {
        const word = wordInput.value.trim();
        const meaning = document.getElementById('inputMeaning').value.trim();
        const example = document.getElementById('inputExample').value.trim();
        if (!word || !meaning) { setStatus('error', '単語と意味を入力してください。'); return; }
        const list = EA.getCustomPhrases();
        const dupIdx = list.findIndex(p => p[1].toLowerCase() === word.toLowerCase());
        if (dupIdx >= 0 && !confirm('「' + word + '」はすでに登録されています。内容を上書きしますか？')) return;
        if (dupIdx >= 0) list.splice(dupIdx, 1);
        // 同じ英文が標準フレーズにある場合も重複扱いにならないよう、マイ単語側のカテゴリで保持
        list.unshift([EA.CUSTOM_CAT, word, meaning, example]);
        if (!EA.saveCustomPhrases(list)) { setStatus('error', '❌ 保存に失敗しました。ブラウザの保存領域を確認してください。'); return; }
        wordInput.value = '';
        document.getElementById('inputMeaning').value = '';
        document.getElementById('inputExample').value = '';
        setStatus('ok', '🎉 マイ単語帳に追加しました！');
        renderCustomList();
      });
    });

  </script>
</body>
</html>
