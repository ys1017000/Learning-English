<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>単語追加</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 10px; color: #3498db; text-decoration: none; font-weight: bold; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav"><a href="index.html">← ホームへ戻る</a></div>
        <h1>新しい単語を追加</h1>
        <input type="text" id="newWord" placeholder="英単語 (例: apple)">
        <input type="text" id="newMeaning" placeholder="意味 (例: りんご)">
        <button onclick="addWord()">追加</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
