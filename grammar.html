<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>心をつなぐ英語表現 - 文法ノート</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="common.css?v=23">
</head>
<body>
  <header>
    <a href="index.html" class="logo">心をつなぐ英語表現</a>
    <span id="streakBadge" class="streak-badge">🔥 0日連続学習</span>
  </header>
  <div class="subnav">
    <a href="roadmap.html">🗺 計画</a>
    <a href="grammar.html" class="active" aria-current="page">📖 文法</a>
    <a href="quiz.html">❓ クイズ</a>
    <a href="writing.html">✍️ 英作文</a>
    <a href="speaking.html">🎙️ 発音</a>
    <a href="talk.html">💭 お題</a>
    <a href="addword.html">➕ 単語</a>
    <a href="phrases.html">📚 表現集</a>
  </div>
  <div class="container">
    <select id="topicGroup" class="genre-select-box genre-group-box" aria-label="文法のジャンル" style="display:none;"></select>
    <select id="topicSelect" class="genre-select-box topic-select" aria-label="文法の項目" style="display:none;"></select>
    <style>#tabChips { flex-wrap: nowrap; overflow-x: auto; } #tabChips .chip { padding: 0.4rem 0.55rem; white-space: nowrap; flex-shrink: 0; }</style>
    <div class="chip-row" id="tabChips" role="group" aria-label="表示の切り替え">
      <button class="chip active" data-tab="note">📖 ノート</button>
      <button class="chip" data-tab="quiz">🎯 クイズ</button>
      <button class="chip" data-tab="order">🧩 並べ替え</button>
      <button class="chip" data-tab="drill">🗣 声に出す</button>
    </div>
    <div id="viewNote"></div>
    <div id="viewQuiz" style="display:none;"></div>
    <div id="viewOrder" class="card" style="display:none;"></div>
    <div id="viewDrill" class="card" style="display:none;"></div>
  </div>
  <nav>
    <a href="index.html">🏠 ホーム</a>
    <a href="translator.html">💬 会話</a>
    <a href="plan.html">📅 予習</a>
    <a href="recap.html">📝 ふり返り</a>
    <a href="quiz.html" class="active" aria-current="page">✍️ 練習</a>
  </nav>
  <script src="common.js?v=45"></script>
  <script src="usage-data.js?v=32"></script>
  <script src="grammar-data.js?v=34"></script>
  <script>
    const GR = window.GR;
    const $ = id => document.getElementById(id);
    const esc = EA.esc;
    let topicIdx = 0, tab = 'note', quiz = null;
    const topic = () => GR.TOPICS[topicIdx];

    function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    function itemFor(full) {
      const k = full.toLowerCase();
      return EA.getAllPhrases().find(x => x[1].toLowerCase() === k) || [EA.CUSTOM_CAT, full, '', ''];
    }
    function speakBtns(en) {
      return '<button class="icon-btn" data-speak="' + esc(en) + '" aria-label="英語を再生">🔊</button><button class="icon-btn" data-speak="' + esc(en) + '" data-slow="1" aria-label="ゆっくり再生">🐢</button>';
    }

    /* ---------- ノート ---------- */
    function renderNote() {
      const T = topic();
      let html = '<div class="card next-step"><h2 style="margin-bottom:0.4rem;">' + esc(T.title) + '</h2><div class="muted">' + esc(T.intro) + '</div></div>';
      T.groups.forEach(g => {
        html += '<div class="section-title">' + esc(g.name) + '</div><p class="muted" style="margin-bottom:0.6rem;">' + esc(g.note) + '</p>';
        g.forms.forEach(f => {
          html += '<div class="card gr-form"><div class="gr-key">' + esc(f.key) + '</div>' +
            (f.kana ? '<div class="muted">読み方：<b>' + esc(f.kana) + '</b>' + esc(f.kanaNote != null ? f.kanaNote : '（弱く言う）') + '</div>' : '') +
            '<div class="muted" style="margin-top:0.3rem;">' + esc(f.label) + '</div>' +
            '<div class="gr-ja">' + esc(f.ja) + '</div><div class="muted">' + esc(f.nuance) + '</div>' +
            '<div class="item-row" style="margin-top:0.7rem;"><div style="display:flex; justify-content:space-between; gap:6px; align-items:center;"><div><div class="en-text">' + esc(f.ex[0]) + '</div><div class="ja-text muted">' + esc(f.ex[1]) + '</div></div><div style="display:flex; gap:4px;">' + speakBtns(f.ex[0]) + '</div></div></div>' +
            '<div class="muted gr-tone">💡 ' + esc(f.tone) + '</div></div>';
        });
      });
      html += '<div class="card"><h2>🔍 ニュアンスの比べ方</h2><div class="muted" style="margin-bottom:0.5rem;">' + esc(T.compare.lead) + '</div>' +
        T.compare.rows.map(r => '<div class="item-row"><div style="display:flex; justify-content:space-between; gap:6px; align-items:center;"><div><div class="en-text">' + esc(r[0]) + '</div><div class="ja-text muted">' + esc(r[1]) + '</div></div><div>' + speakBtns(r[0]).split('</button>')[0] + '</button></div></div></div>').join('') + '</div>';
      html += '<div class="card"><h2>⚠️ 注意しておきたいこと</h2><ul style="padding-left:1.1rem;" class="muted">' + T.cautions.map(c => '<li style="margin-bottom:0.5rem;">' + esc(c) + '</li>').join('') + '</ul></div>';
      html += '<button class="btn" data-act="toQuiz">🎯 判定クイズに挑戦する</button>' +
        '<div style="display:flex; gap:8px; margin-top:0.5rem;"><a href="phrases.html" class="btn btn-secondary" style="flex:1; font-size:0.85rem;">📚 表現集で例文を見る</a><a href="writing.html" class="btn btn-secondary" style="flex:1; font-size:0.85rem;">✍️ 英作文で練習</a></div>';
      $('viewNote').innerHTML = html;
    }

    /* ---------- 判定クイズ ---------- */
    function startQuiz(questions) {
      quiz = { qs: shuffle(questions || topic().quiz), i: 0, ok: 0, missed: [], answered: false };
      renderQuiz();
    }
    function blankSentence(s) { return esc(s).replace('___', '<span class="gr-blank">＿＿＿＿</span>'); }
    function renderQuiz() {
      const box = $('viewQuiz');
      if (!quiz) { startQuiz(); return; }
      if (quiz.i >= quiz.qs.length) {
        const n = quiz.qs.length, pct = Math.round(quiz.ok * 100 / n);
        box.innerHTML = '<div class="card" style="text-align:center;"><div style="font-size:2.5rem;">' + (pct >= 80 ? '🏆' : '💪') + '</div><h2>クイズ完了！</h2>' +
          '<div style="font-size:1.4rem; font-weight:bold; color:var(--primary); margin:0.5rem 0;">' + quiz.ok + ' / ' + n + '（' + pct + '%）</div>' +
          '<p class="muted">' + (quiz.missed.length ? '間違えた問題は弱点として記録され、復習クイズに出ます。' : '全問正解です！') + '</p>' +
          (quiz.missed.length ? '<div style="text-align:left; margin-top:0.75rem;">' + quiz.missed.map(q => '<div class="item-row"><div style="display:flex; justify-content:space-between; gap:6px; align-items:center;"><div><div class="en-text">' + esc(q.full) + '</div><div class="ja-text muted">' + esc(q.situation) + '</div><div class="muted" style="margin-top:0.2rem;">' + esc(q.why) + '</div></div><div>' + speakBtns(q.full).split('</button>')[0] + '</button></div></div></div>').join('') + '</div>' : '') +
          '<button class="btn" data-act="restart" style="margin-top:0.75rem;">🔄 もう一度（全問）</button>' +
          (quiz.missed.length ? '<button class="btn btn-secondary" data-act="retryMissed" style="margin-top:0.5rem;">間違えた' + quiz.missed.length + '問だけ もう一度</button>' : '') +
          '</div>';
        return;
      }
      const q = quiz.qs[quiz.i];
      quiz.opts = quiz.opts && quiz.optsFor === q ? quiz.opts : shuffle(q.options);
      quiz.optsFor = q;
      box.innerHTML = '<div class="card"><div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;"><span class="muted">文法クイズ</span><span style="font-weight:bold; color:var(--primary);">' + (quiz.i + 1) + ' / ' + quiz.qs.length + '</span></div>' +
        '<div class="progress-bar-container"><div class="progress-bar-fill" style="width:' + Math.round(quiz.i / quiz.qs.length * 100) + '%"></div></div>' +
        '<div class="muted" style="margin-top:0.9rem;">こんな場面：</div><div class="question" style="margin-bottom:0.6rem;">' + esc(q.situation) + '</div>' +
        '<div class="gr-sentence">' + blankSentence(q.sentence) + '</div>' +
        '<div class="options" id="grOptions">' + quiz.opts.map(o => '<button class="option-btn" data-opt="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>' +
        '<div class="feedback" id="grFeedback" role="status"></div><button class="btn" id="grNext" data-act="next" style="display:none; margin-top:1rem;">次の問題へ</button></div>';
    }
    function answerQuiz(btn) {
      if (!quiz || quiz.answered) return;
      const q = quiz.qs[quiz.i], pick = btn.dataset.opt, ok = pick === q.answer;
      quiz.answered = true;
      document.querySelectorAll('#grOptions .option-btn').forEach(b => {
        b.disabled = true;
        if (b.dataset.opt === q.answer) b.classList.add('correct');
        else if (b === btn) b.classList.add('wrong');
      });
      if (ok) quiz.ok += 1; else quiz.missed.push(q);
      EA.recordResult(itemFor(q.full), ok, 'grammar');
      const fb = $('grFeedback');
      fb.className = 'feedback ' + (ok ? 'correct' : 'wrong'); fb.style.display = 'block';
      fb.innerHTML = (ok ? '⭕ 正解！' : '❌ 正解は ' + esc(q.answer)) + '<span class="sub">' + esc(q.why) + '</span><span class="sub"><b>' + esc(q.full) + '</b></span>' + (EA.usageFor(q.full) ? '<span class="sub usage-line">🎬 場面：' + esc(EA.usageFor(q.full)) + '</span>' : '') +
        '<div style="margin-top:0.4rem;">' + speakBtns(q.full) + '</div>';
      $('grNext').style.display = 'block';
      $('grNext').textContent = quiz.i + 1 >= quiz.qs.length ? '結果を見る' : '次の問題へ';
    }

    /* ---------- 声に出す（この項目の文を、日本語を見て言う） ---------- */
    function drillItems(T) {
      const all = EA.getAllPhrases(), out = [], seen = new Set();
      const add = (en, ja) => {
        const k = String(en).toLowerCase(); if (!en || seen.has(k)) return; seen.add(k);
        const p = all.find(x => x[1].toLowerCase() === k);
        out.push(p || ['文法・表現パターン', en, ja || '']);
      };
      T.groups.forEach(g => g.forms.forEach(f => { if (f.ex && f.ex[0]) add(f.ex[0], f.ex[1]); }));
      T.quiz.forEach(q => add(q.full, q.situation));
      const ok = out.filter(p => p[2]), act = ok.filter(p => !EA.isResting(p[1]));
      return act.length ? act : ok;
    }
    function renderDrill() {
      const T = GR.TOPICS[topicIdx];
      EA.cardDrill($('viewDrill'), { title: T.short, items: drillItems(T), record: true });
    }

    /* ---------- 🧩 並べ替え（日本語を見て、単語カードを正しい順に並べる＝文の「形」を体で覚える） ---------- */
    const ORDER_SIZE = 8;
    let ord = null;
    function orderItems(T) {
      const out = [], seen = new Set();
      const add = (en, ja) => {
        en = String(en || '').trim(); const k = en.toLowerCase();
        if (!en || !ja || seen.has(k)) return;
        const n = en.split(/\s+/).length;
        if (n < 3 || n > 12) return;
        seen.add(k); out.push({ en, ja: EA.splitJa ? EA.splitJa(ja).main : ja });
      };
      T.groups.forEach(g => g.forms.forEach(f => { if (f.ex && f.ex[0]) add(f.ex[0], f.ex[1]); }));
      T.quiz.forEach(q => { const p = itemFor(q.full); add(q.full, p[2]); });
      return out;
    }
    function startOrder(list) {
      const T = topic();
      const pool = list || shuffle(orderItems(T)).slice(0, ORDER_SIZE);
      ord = { id: T.id, list: pool, i: 0, ok: 0, missed: [], done: false };
      newOrderQ();
      renderOrder();
    }
    function newOrderQ() {
      const q = ord.list[ord.i]; if (!q) return;
      const words = q.en.split(/\s+/);
      let bank = shuffle(words.map((w, k) => ({ w, k })));
      // たまたま正解と同じ並びになったら、ずらす
      if (words.length > 1 && bank.every((b, k) => b.w === words[k])) bank = bank.slice(1).concat(bank[0]);
      ord.words = words; ord.bank = bank; ord.picked = []; ord.checked = false; ord.hint = 0;
    }
    const norm = w => w.toLowerCase().replace(/[^a-z0-9']/g, '');
    function renderOrder() {
      const box = $('viewOrder'), T = topic();
      if (!ord || ord.id !== T.id) { startOrder(); return; }
      if (!ord.list.length) { box.innerHTML = '<p class="muted">この項目には、並べ替えに使える例文がまだありません。</p>'; return; }
      if (ord.i >= ord.list.length) {
        const n = ord.list.length;
        box.innerHTML = '<h3 style="margin-bottom:0.5rem;">🧩 並べ替え おわり</h3>' +
          '<div class="stats-grid" style="grid-template-columns:1fr; margin-bottom:0.75rem;"><div><div class="stat-number">' + ord.ok + '/' + n + '</div><div class="stat-label">ヒントなしで正解</div></div></div>' +
          (ord.missed.length ? '<p class="muted" style="margin-bottom:0.5rem;">もう一度やると覚えやすい文：</p>' + ord.missed.map(q => '<div class="item-row"><div class="en-text">' + esc(q.en) + '</div><div class="ja-text muted">' + esc(q.ja) + '</div></div>').join('') : '<p style="margin-bottom:0.5rem;">全部ヒントなしで並べられました 🎉</p>') +
          '<div style="display:flex; gap:8px; margin-top:0.75rem; flex-wrap:wrap;">' +
          (ord.missed.length ? '<button class="btn" data-ord="retry" style="flex:1;">🔁 まちがえた文だけ</button>' : '') +
          '<button class="btn" data-ord="restart" style="flex:1;' + (ord.missed.length ? ' background:#64748b;' : '') + '">🔀 別の文でもう一回</button></div>';
        const s = EA.getStore(); if (EA.touchToday) EA.touchToday(s); EA.saveStore(s); EA.updateStreakBadge();
        return;
      }
      const q = ord.list[ord.i];
      const built = ord.picked.map(k => ord.words[k]);
      const chip = (w, attrs, extra) => '<button class="chip" ' + attrs + ' style="font-size:1rem; padding:0.45rem 0.8rem;' + (extra || '') + '">' + esc(w) + '</button>';
      let res = '';
      if (ord.checked) {
        const ok = built.map(norm).join(' ') === ord.words.map(norm).join(' ');
        res = '<div style="margin-top:0.75rem; padding:0.75rem; border-radius:8px; background:' + (ok ? '#dcfce7' : '#fee2e2') + ';">' +
          '<div style="font-weight:bold; margin-bottom:0.25rem;">' + (ok ? '⭕ 正解！' : '❌ 正しい順番はこちら') + '</div>' +
          '<div class="en-text">' + esc(q.en) + '</div>' +
          '<div style="display:flex; gap:6px; margin-top:0.5rem;"><button class="tiny-btn" data-speak="' + esc(q.en) + '">🔊 聞く</button><button class="tiny-btn" data-speak="' + esc(q.en) + '" data-slow="1">🐢 ゆっくり</button></div>' +
          '<p class="muted" style="font-size:0.85rem; margin-top:0.4rem;">聞いたあと、声に出して1回まねしてみよう。</p></div>' +
          '<button class="btn" data-ord="next" style="margin-top:0.75rem; width:100%;">' + (ord.i + 1 < ord.list.length ? '次へ ▶' : '結果を見る') + '</button>';
      }
      box.innerHTML =
        '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;"><h3 style="font-size:1rem;">🧩 並べ替え（' + (ord.i + 1) + '/' + ord.list.length + '）</h3><span class="muted" style="font-size:0.8rem;">' + esc(T.short) + '</span></div>' +
        '<p class="muted" style="font-size:0.85rem; margin-bottom:0.5rem;">日本語の意味になるように、下の単語をタップして順に並べよう。</p>' +
        '<div class="ja-text" style="font-size:1.05rem; font-weight:600; margin-bottom:0.75rem;">' + esc(q.ja) + '</div>' +
        '<div id="ordBuilt" style="min-height:3rem; border:2px dashed var(--border); border-radius:8px; padding:0.5rem; display:flex; flex-wrap:wrap; gap:6px; margin-bottom:0.75rem;">' +
          (built.length ? ord.picked.map((k, j) => chip(ord.words[k], ord.checked ? 'disabled' : 'data-ord="back" data-j="' + j + '"', ' background:#eef2ff; border-color:var(--primary);' + (j < ord.hint ? ' outline:2px solid #f59e0b;' : ''))).join('') : '<span class="muted" style="font-size:0.85rem; align-self:center;">ここに並びます（まちがえたら単語をタップで戻せます）</span>') +
        '</div>' +
        (ord.checked ? '' :
          '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:0.75rem;">' +
            ord.bank.map((b, j) => ord.picked.includes(b.k) ? '' : chip(b.w, 'data-ord="pick" data-j="' + j + '"')).join('') +
          '</div>' +
          '<div style="display:flex; gap:8px;">' +
            '<button class="tiny-btn" data-ord="hint" style="flex:1;">💡 ヒント</button>' +
            '<button class="tiny-btn" data-ord="clear" style="flex:1;">↺ 戻す</button>' +
            '<button class="btn" data-ord="check" style="flex:2;"' + (ord.picked.length === ord.words.length ? '' : ' disabled') + '>✓ 答え合わせ</button>' +
          '</div>') + res;
    }
    function orderAct(t) {
      const a = t.dataset.ord;
      if (a === 'restart') { startOrder(); return; }
      if (a === 'retry') { startOrder(shuffle(ord.missed)); return; }
      if (a === 'pick') { const b = ord.bank[+t.dataset.j]; if (b && !ord.picked.includes(b.k)) ord.picked.push(b.k); }
      else if (a === 'back') { const j = +t.dataset.j; if (j >= ord.hint) ord.picked.splice(j, 1); }
      else if (a === 'clear') { ord.picked = ord.picked.slice(0, ord.hint); }
      else if (a === 'hint') {
        // 先頭から合っている所まで残し、次の正しい1語を置く（同じ単語が複数あっても OK）
        let n = 0; while (n < ord.picked.length && norm(ord.words[ord.picked[n]]) === norm(ord.words[n])) n++;
        if (n >= ord.words.length) return;
        ord.picked = ord.picked.slice(0, n);
        const want = norm(ord.words[n]);
        const k = ord.words.map((w, i) => i).find(i => !ord.picked.includes(i) && norm(ord.words[i]) === want);
        ord.picked.push(k); ord.hint = n + 1; ord.usedHint = true;
      }
      else if (a === 'check') {
        ord.checked = true;
        const ok = ord.picked.map(k => norm(ord.words[k])).join(' ') === ord.words.map(norm).join(' ');
        const q = ord.list[ord.i];
        if (ok && !ord.hint) ord.ok++; else ord.missed.push(q);
        if (ok) EA.speak(q.en, 'en-US', 1);
      }
      else if (a === 'next') { ord.i++; newOrderQ(); renderOrder(); EA.scrollToCard && EA.scrollToCard($('viewOrder'), false); return; }
      renderOrder();
    }

    /* ---------- 切り替え ---------- */
    function setTab(name) {
      tab = name;
      document.querySelectorAll('#tabChips .chip').forEach(c => c.classList.toggle('active', c.dataset.tab === name));
      $('viewNote').style.display = name === 'note' ? '' : 'none';
      $('viewQuiz').style.display = name === 'quiz' ? '' : 'none';
      $('viewDrill').style.display = name === 'drill' ? '' : 'none';
      $('viewOrder').style.display = name === 'order' ? '' : 'none';
      if (name === 'quiz') renderQuiz(); else if (name === 'drill') renderDrill(); else if (name === 'order') { if (!ord) startOrder(); else renderOrder(); } else renderNote();
    }
    // ジャンル（GR.GROUPS）→ 項目の2段階で選ぶ。先頭は「すべて」、どのジャンルにもない項目は「その他」
    let groupKey = '';
    function topicGroups() {
      const ids = GR.TOPICS.map(t => t.id), used = new Set();
      const gs = (GR.GROUPS || []).map((g, k) => {
        const idx = g.ids.map(id => ids.indexOf(id)).filter(i => i >= 0);
        idx.forEach(i => used.add(i));
        return { key: 'g' + k, name: g.name, idx: idx.sort((a, b) => a - b) };
      }).filter(g => g.idx.length);
      const rest = ids.map((_, i) => i).filter(i => !used.has(i));
      if (rest.length) gs.push({ key: 'rest', name: '📁 その他', idx: rest });
      return [{ key: 'all', name: '📚 すべての項目', idx: ids.map((_, i) => i) }].concat(gs);
    }
    function renderTopics() {
      const box = $('topicSelect'), gbox = $('topicGroup');
      if (GR.TOPICS.length < 2) return;
      const gs = topicGroups();
      let g = gs.find(x => x.key === groupKey && x.idx.includes(topicIdx));
      if (!g) g = gs.find(x => x.key !== 'all' && x.idx.includes(topicIdx)) || gs[0];
      groupKey = g.key;
      gbox.style.display = gs.length > 1 ? '' : 'none';
      gbox.innerHTML = gs.map(x => '<option value="' + x.key + '">' + esc(x.name) + '（' + x.idx.length + '）</option>').join('');
      gbox.value = g.key;
      box.style.display = '';
      box.innerHTML = g.idx.map(i => '<option value="' + i + '">📖 ' + (i + 1) + '. ' + esc(GR.TOPICS[i].short) + '</option>').join('');
      box.value = String(topicIdx);
    }
    document.addEventListener('click', e => {
      const sp = e.target.closest('[data-speak]');
      if (sp) { EA.speak(sp.dataset.speak, 'en-US', sp.dataset.slow ? 0.7 : 1); return; }
      const od = e.target.closest('[data-ord]');
      if (od) { if (!od.disabled) orderAct(od); return; }
      const tb = e.target.closest('[data-tab]');
      if (tb) { setTab(tb.dataset.tab); return; }
      const op = e.target.closest('[data-opt]');
      if (op) { answerQuiz(op); return; }
      const a = e.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'toQuiz') { setTab('quiz'); window.scrollTo(0, 0); }
      else if (a.dataset.act === 'next') { quiz.i += 1; quiz.answered = false; quiz.opts = null; renderQuiz(); }
      else if (a.dataset.act === 'restart') { startQuiz(); }
      else if (a.dataset.act === 'retryMissed') { startQuiz(quiz.missed); }
    });
    // 選んだ項目は id で覚える。以前は番号で覚えていたので、番号なら当時の並び（OLD）で id に読み替える
    try {
      const s = localStorage.getItem('english_app_grammar_topic') || '';
      let t = GR.TOPICS.findIndex(x => x.id === s);
      // 2026-11-10 以前の並び（番号で保存されていたころ）
      const OLD = ['modal-perfect', 'thought-would', 'comparative', 'frequency', 'present-perfect', 'past-perfect', 'hope-wish', 'get-adj', 'there-have-been', 'linking', 'small-mistakes', 'for-usage'];
      if (t < 0 && /^\d+$/.test(s) && OLD[+s]) t = GR.TOPICS.findIndex(x => x.id === OLD[+s]);
      if (t > 0 && t < GR.TOPICS.length) topicIdx = t;
    } catch (err) {}
    function selectTopic(i) {
      topicIdx = i; quiz = null; ord = null;
      try { localStorage.setItem('english_app_grammar_topic', GR.TOPICS[topicIdx].id); } catch (err) {}
      renderTopics(); setTab(tab); window.scrollTo(0, 0);
    }
    $('topicSelect').addEventListener('change', e => selectTopic(+e.target.value));
    // ジャンルを変えたら、そのジャンルの最初の項目を開く
    $('topicGroup').addEventListener('change', e => {
      const g = topicGroups().find(x => x.key === e.target.value);
      if (!g) return;
      groupKey = g.key;
      selectTopic(g.idx.includes(topicIdx) ? topicIdx : g.idx[0]);
    });
    renderTopics();
    renderNote();
    EA.updateStreakBadge();

  </script>
</body>
</html>
