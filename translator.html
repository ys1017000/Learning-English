<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>心をつなぐ英語表現 - 翻訳会話</title>
  <link rel="stylesheet" href="common.css?v=3">
</head>
<body>
  <header>
    <a href="index.html" class="logo">心をつなぐ英語表現</a>
    <span id="streakBadge" class="streak-badge">🔥 0日連続学習</span>
  </header>
  <div class="container">
    <div class="card">
      <h2>🌐 リアルタイム会話・音声翻訳ツール</h2>
      <p class="muted" style="margin-bottom:1rem;">日本語または英語を入力・発話すると、オンライン翻訳で変換しネイティブ音声で読み上げます。🎙️を押して話すと、話し終えた時点で自動的に翻訳します。</p>
      <div style="margin-bottom:1rem;">
        <label for="transDirection" style="font-size:0.8rem; font-weight:bold; color:var(--text-muted);">翻訳モード:</label>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <select id="transDirection" class="genre-select-box" style="margin-bottom:0; flex:1;">
            <option value="en2ja">🇬🇧 英語 ➔ 🇯🇵 日本語</option>
            <option value="ja2en">🇯🇵 日本語 ➔ 🇬🇧 英語</option>
          </select>
          <button class="btn btn-secondary" id="swapBtn" style="width:auto; padding:0 1rem;" aria-label="翻訳の向きを入れ替える">⇄</button>
        </div>
      </div>
      <div id="micNotice" class="notice" style="display:none;"></div>
      <textarea id="transInput" placeholder="翻訳したい文章を入力するか、音声ボタンを押してください..." aria-label="翻訳したい文章"></textarea>
      <div style="display:flex; gap:8px; margin-bottom:1rem;">
        <button class="btn" id="translateBtn" style="flex:1;">🔄 翻訳を実行</button>
        <button class="btn btn-record" id="transMicBtn" style="flex:1;">🎙️ 音声入力</button>
      </div>
      <div class="answer-box" id="resultContainer" style="display:block; background:#f8fafc; border:1px solid var(--border);">
        <div style="font-size:0.8rem; color:var(--text-muted);">翻訳結果:</div>
        <div id="transOutput" style="font-size:1.1rem; font-weight:bold; color:var(--primary); margin:0.5rem 0;">（ここに結果が表示されます）</div>
        <button class="btn" id="transSpeakBtn" style="background:#4338ca; margin-top:0.5rem;" disabled>🔊 ネイティブ音声で読み上げる</button>
      </div>
    </div>
  </div>

  <nav>
    <a href="index.html">🏠 ホーム</a>
    <a href="quiz.html">❓ クイズ</a>
    <a href="writing.html">✍️ 英作文</a>
    <a href="speaking.html">🎙️ 発音</a>
    <a href="translator.html" class="active" aria-current="page">🌐 翻訳会話</a>
    <a href="addword.html">➕ 単語追加</a>
    <a href="phrases.html">📚 表現集</a>
  </nav>
  <script src="common.js?v=3"></script>
  <script>
    let lastTranslation = '', lastLang = 'en-US', translateSeq = 0, recognizer = null;

    const dirLang = dir => dir === 'ja2en' ? { src: 'ja-JP', dst: 'en-US' } : { src: 'en-US', dst: 'ja-JP' };

    function decodeEntities(s) {
      const doc = new DOMParser().parseFromString(String(s), 'text/html');
      return doc.documentElement.textContent || '';
    }

    // 戻り値: { ok: boolean, text: string }
    async function translateText(text, dir) {
      if (!text.trim()) return { ok: false, text: '（テキストを入力してください）' };
      const langpair = dir === 'ja2en' ? 'ja|en' : 'en|ja';
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 10000);
        const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + langpair, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('http ' + res.status);
        const data = await res.json();
        const status = Number(data && data.responseStatus);
        const out = data && data.responseData && data.responseData.translatedText;
        if (status === 200 && out) return { ok: true, text: decodeEntities(out) };
        if (status === 429) return { ok: false, text: '無料翻訳の1日の利用上限に達しました。しばらくしてからお試しください。' };
        if (/QUERY LENGTH LIMIT/i.test(String(out))) return { ok: false, text: '文章が長すぎます（500文字以内にしてください）。' };
      } catch (e) {}
      return { ok: false, text: '翻訳エラーが発生しました。通信状況を確認してもう一度お試しください。' };
    }

    async function runTranslate() {
      const input = document.getElementById('transInput');
      const output = document.getElementById('transOutput');
      const dir = document.getElementById('transDirection').value;
      const seq = ++translateSeq;     // 連打しても最後の結果だけを表示
      output.textContent = '🔄 翻訳中...';
      document.getElementById('transSpeakBtn').disabled = true;
      const r = await translateText(input.value, dir);
      if (seq !== translateSeq) return;
      output.textContent = r.text;
      lastTranslation = r.ok ? r.text : '';
      lastLang = dirLang(dir).dst;
      document.getElementById('transSpeakBtn').disabled = !r.ok;
      if (r.ok) EA.speak(lastTranslation, lastLang, 1.0);
    }

    function setMicUI(on) {
      const btn = document.getElementById('transMicBtn');
      btn.classList.toggle('recording', on);
      btn.textContent = on ? '⏹ 聞き取り中…' : '🎙️ 音声入力';
    }
    function showMicError(msg) {
      const n = document.getElementById('micNotice');
      n.className = 'notice error';
      n.textContent = msg;
      n.style.display = 'block';
    }

    function setupMic() {
      const btn = document.getElementById('transMicBtn');
      if (!EA.recognitionSupported) {
        const n = document.getElementById('micNotice');
        n.textContent = 'このブラウザは音声入力に対応していません。iPhoneはSafari、AndroidやPCはChromeでお試しください。文字入力は使えます。';
        n.style.display = 'block';
        btn.disabled = true;
        return;
      }
      const input = document.getElementById('transInput');
      recognizer = EA.createRecognizer({
        lang: dirLang(document.getElementById('transDirection').value).src,
        onState: setMicUI,
        onInterim: text => { input.value = text; },
        onFinal: alts => { input.value = alts[0]; runTranslate(); },   // 話し終えたら自動で翻訳
        onError: showMicError
      });
      btn.addEventListener('click', () => {
        if (recognizer.listening) { recognizer.stop(); return; }
        document.getElementById('micNotice').style.display = 'none';
        recognizer.setLang(dirLang(document.getElementById('transDirection').value).src);
        recognizer.start();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const dirSelect = document.getElementById('transDirection');
      document.getElementById('translateBtn').addEventListener('click', runTranslate);
      document.getElementById('transInput').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runTranslate(); });
      document.getElementById('transSpeakBtn').addEventListener('click', () => { if (lastTranslation) EA.speak(lastTranslation, lastLang, 1.0); });
      document.getElementById('swapBtn').addEventListener('click', () => {
        // 向きを入れ替え、直前の翻訳結果を入力欄に移す（往復の会話がしやすい）
        const input = document.getElementById('transInput');
        dirSelect.value = dirSelect.value === 'en2ja' ? 'ja2en' : 'en2ja';
        if (lastTranslation) input.value = lastTranslation;
        lastTranslation = '';
        document.getElementById('transOutput').textContent = '（ここに結果が表示されます）';
        document.getElementById('transSpeakBtn').disabled = true;
        if (recognizer) recognizer.setLang(dirLang(dirSelect.value).src);
      });
      dirSelect.addEventListener('change', () => { if (recognizer) recognizer.setLang(dirLang(dirSelect.value).src); });
      setupMic();
    });

  </script>
</body>
</html>
