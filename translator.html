<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>心をつなぐ英語表現 - 翻訳会話</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="common.css?v=23">
</head>
<body>
  <header>
    <a href="index.html" class="logo">心をつなぐ英語表現</a>
    <span id="streakBadge" class="streak-badge">🔥 0日連続学習</span>
  </header>
  <div class="subnav">
    <a href="translator.html" class="active" aria-current="page">💬 会話</a>
    <a href="topics.html">🎲 話題</a>
    <a href="nihongo.html">🇯🇵 日本語</a>
  </div>
  <div class="container">
    <div id="offlineNotice" class="notice error" style="display:none;">📴 オフラインです。翻訳には通信が必要です。<a href="scenes.html">「気持ちから探す」</a>や表現集はオフラインでも使えます。</div>
    <div id="micNotice" class="notice" style="display:none;"></div>
    <details style="margin-bottom:0.75rem;">
      <summary class="muted" style="cursor:pointer;">⚙️ 設定</summary>
      <div class="radio-row" style="margin-top:0.5rem;">
        <label><input type="checkbox" id="optSpeakMine"> 自分の英訳を読み上げる</label>
        <label><input type="checkbox" id="optSpeakPartner"> 相手の日本語訳を読み上げる</label>
        <label><input type="checkbox" id="optKana"> カタカナ発音ヒントを表示する</label>
      </div>
    </details>
    <div id="chat" class="chat" aria-live="polite"></div>
  </div>

  <div class="talk-bar">
    <div class="talk-bar-inner">
      <div class="live-box" id="liveBox"></div>
      <div class="mic-row">
        <button class="btn btn-me" id="micMe">🎙️ 自分（日本語で話す）</button>
        <button class="btn btn-partner" id="micPartner">🎙️ 相手（英語を聞く）</button>
      </div>
      <div class="bar-row">
        <button class="tiny-btn" id="openPins">📌 準備フレーズ</button>
        <button class="tiny-btn" id="openFinder">🔍 言葉が出てこない</button>
        <button class="tiny-btn" id="textToggle">⌨️ 文字入力</button>
      </div>
      <div class="text-row" id="textRow">
        <input type="text" id="textInput" placeholder="文章を入力..." aria-label="翻訳したい文章">
        <button class="btn btn-me" id="sendMe">日→英</button>
        <button class="btn btn-partner" id="sendPartner">英→日</button>
      </div>
    </div>
  </div>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="pinSheet" role="dialog" aria-label="準備したフレーズ" aria-hidden="true">
    <div class="sheet-inner">
      <h3>📌 準備したフレーズ <button class="tiny-btn" data-close>閉じる</button></h3>
      <p class="muted" style="margin-bottom:0.5rem;">言えたら「✅ 使えた！」を押すと記録され、あとで振り返れます。</p>
      <div id="pinList"></div>
    </div>
  </div>
  <div class="sheet" id="finderSheet" role="dialog" aria-label="言葉が出てこないとき" aria-hidden="true">
    <div class="sheet-inner">
      <h3>🔍 言葉が出てこないとき <button class="tiny-btn" data-close>閉じる</button></h3>
      <div style="display:flex; gap:6px;">
        <input type="text" id="finderInput" placeholder="日本語で一言（例: 懐かしい、おすすめ）" aria-label="日本語で検索" style="margin-bottom:0;">
        <button class="btn" id="finderBtn" style="width:auto; padding:0 1rem;">検索</button>
      </div>
      <div id="finderResults" style="margin-top:0.75rem;"></div>
    </div>
  </div>

  <nav>
    <a href="index.html">🏠 ホーム</a>
    <a href="translator.html" class="active" aria-current="page">💬 会話</a>
    <a href="plan.html">📅 予習</a>
    <a href="recap.html">📝 ふり返り</a>
    <a href="quiz.html">✍️ 練習</a>
  </nav>
  <script src="common.js?v=33"></script>
  <script src="content.js?v=8"></script>
  <script>
    // 自分(me): 日本語で話す → 英訳して表示/読み上げ。相手(partner): 英語を聞く → 日本語訳を表示
    const MODE = {
      me: { src: 'ja-JP', dst: 'en-US', pair: 'ja|en', label: '自分' },
      partner: { src: 'en-US', dst: 'ja-JP', pair: 'en|ja', label: '相手' }
    };
    let recognizer = null, activeWho = null, hiddenBefore = 0, busy = false;

    function toast(msg) {
      let el = document.getElementById('toast');
      if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
      el.textContent = msg; el.classList.add('show');
      clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function decodeEntities(s) { return new DOMParser().parseFromString(String(s), 'text/html').documentElement.textContent || ''; }

    // 戻り値: { ok, text }
    async function translate(text, pair) {
      if (!navigator.onLine) return { ok: false, text: 'オフラインのため翻訳できません。' };
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 10000);
        const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + pair, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('http ' + res.status);
        const data = await res.json();
        const status = Number(data && data.responseStatus);
        const out = data && data.responseData && data.responseData.translatedText;
        if (status === 200 && out) return { ok: true, text: decodeEntities(out) };
        if (status === 429) return { ok: false, text: '無料翻訳の1日の利用上限に達しました。しばらくしてからお試しください。' };
        if (/QUERY LENGTH LIMIT/i.test(String(out))) return { ok: false, text: '文章が長すぎます（500文字以内にしてください）。' };
      } catch (e) {}
      return { ok: false, text: '翻訳に失敗しました。通信状況を確認してもう一度お試しください。' };
    }

    /* ---- 表示 ---- */
    function renderChat() {
      const chat = document.getElementById('chat');
      const today = EA.dateKey();
      const list = EA.getTalkLog().filter(e => e.t >= hiddenBefore && EA.dateKey(new Date(e.t)) === today);
      chat.innerHTML = '';
      if (!list.length) {
        chat.innerHTML = '<div class="chat-empty">下のボタンで会話をはじめましょう。<br>🎙️自分＝日本語で話すと英語に、🎙️相手＝相手の英語を日本語にします。<br>会話は自動で保存され、「ふり返り」から復習できます。</div>';
        return;
      }
      list.forEach(e => chat.appendChild(bubble(e)));
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function bubble(e) {
      const b = document.createElement('div');
      b.className = 'bubble ' + e.who;
      const who = document.createElement('div'); who.className = 'b-who'; who.textContent = e.who === 'me' ? '自分' : '相手';
      const en = document.createElement('div'); en.className = 'b-en'; en.textContent = e.en;
      const ja = document.createElement('div'); ja.className = 'b-ja'; ja.textContent = e.ja;
      const kana = document.createElement('div'); kana.className = 'kana-line';
      EA.renderKana(kana, e.en);
      const act = document.createElement('div'); act.className = 'b-actions';
      const play = document.createElement('button'); play.className = 'icon-btn'; play.textContent = '🔊'; play.setAttribute('aria-label', '英語を再生');
      play.addEventListener('click', () => EA.speak(e.en, 'en-US', 1.0));
      const slow = document.createElement('button'); slow.className = 'icon-btn'; slow.textContent = '🐢'; slow.setAttribute('aria-label', 'ゆっくり再生');
      slow.addEventListener('click', () => EA.speak(e.en, 'en-US', 0.7));
      const save = document.createElement('button'); save.className = 'icon-btn'; save.textContent = '💾'; save.setAttribute('aria-label', 'マイ単語に保存');
      if (EA.hasPhrase(e.en)) { save.classList.add('done'); save.textContent = '✅'; }
      save.addEventListener('click', () => {
        const r = EA.addCustomPhrase(e.en, e.ja);
        if (r.added) { save.textContent = '✅'; save.classList.add('done'); toast('マイ単語に保存しました'); }
        else toast(r.reason === 'exists' ? 'すでに保存されています' : '保存できませんでした');
      });
      const pin = document.createElement('button'); pin.className = 'icon-btn'; pin.textContent = EA.isPinned(e.en) ? '📌' : '📍'; pin.setAttribute('aria-label', 'ピン留め');
      pin.addEventListener('click', () => { const on = EA.togglePin(e.en, e.ja); pin.textContent = on ? '📌' : '📍'; toast(on ? 'ピン留めしました' : 'ピン留めを外しました'); });
      act.appendChild(play); act.appendChild(slow); act.appendChild(save); act.appendChild(pin);
      if (e.who === 'partner') {
        const heart = document.createElement('button'); heart.className = 'icon-btn'; heart.setAttribute('aria-label', 'もらった言葉に保存');
        heart.textContent = EA.hasKeepsake(e.en) ? '💝' : '🤍';
        heart.addEventListener('click', () => { if (EA.addKeepsake(e.en, e.ja)) { heart.textContent = '💝'; toast('💝 もらった言葉に保存しました'); } else toast('すでに保存されています'); });
        act.appendChild(heart);
      }
      b.appendChild(who); b.appendChild(en); b.appendChild(ja); b.appendChild(kana); b.appendChild(act);
      return b;
    }

    /* ---- 翻訳して追加 ---- */
    async function handleUtterance(who, text) {
      text = text.trim();
      if (!text || busy) return;
      busy = true;
      setButtonsDisabled(true);
      document.getElementById('liveBox').textContent = '🔄 翻訳中... 「' + text + '」';
      const r = await translate(text, MODE[who].pair);
      busy = false;
      setButtonsDisabled(false);
      if (!r.ok) {
        document.getElementById('liveBox').textContent = '';
        const input = document.getElementById('textInput');
        input.value = text;                       // 再試行できるよう入力欄に残す
        document.getElementById('textRow').classList.add('open');
        toast(r.text);
        return;
      }
      const en = who === 'me' ? r.text : text;
      const ja = who === 'me' ? text : r.text;
      EA.addTalkEntry(who, en, ja);
      EA.updateStreakBadge();
      document.getElementById('liveBox').textContent = '';
      document.getElementById('textInput').value = '';
      renderChat();
      const prefs = EA.getPrefs();
      if (who === 'me' && prefs.speakMine) EA.speak(en, 'en-US', 1.0);
      if (who === 'partner' && prefs.speakPartner) EA.speak(ja, 'ja-JP', 1.0);
    }

    function setButtonsDisabled(d) {
      ['sendMe', 'sendPartner'].forEach(id => { document.getElementById(id).disabled = d; });
    }

    /* ---- 音声入力 ---- */
    function setMicUI(on) {
      const who = activeWho;
      document.getElementById('micMe').classList.toggle('recording', on && who === 'me');
      document.getElementById('micPartner').classList.toggle('recording', on && who === 'partner');
      document.getElementById('micMe').textContent = on && who === 'me' ? '⏹ 聞き取り中…' : '🎙️ 自分（日本語で話す）';
      document.getElementById('micPartner').textContent = on && who === 'partner' ? '⏹ 聞き取り中…' : '🎙️ 相手（英語を聞く）';
      if (on) document.getElementById('liveBox').textContent = who === 'me' ? '🎙️ 日本語でどうぞ…' : '🎙️ 相手の英語を聞いています…';
    }

    function setupMic() {
      if (!EA.recognitionSupported) {
        const n = document.getElementById('micNotice');
        n.textContent = 'このブラウザは音声入力に対応していません。iPhoneはSafari、AndroidやPCはChromeでお試しください。「⌨️ 文字で入力」は使えます。';
        n.style.display = 'block';
        document.getElementById('micMe').disabled = true;
        document.getElementById('micPartner').disabled = true;
        return;
      }
      recognizer = EA.createRecognizer({
        lang: 'ja-JP',
        onState: setMicUI,
        onInterim: text => { document.getElementById('liveBox').textContent = '🎙️ ' + text; },
        onFinal: alts => { const who = activeWho; handleUtterance(who, alts[0]); },
        onError: msg => { document.getElementById('liveBox').textContent = ''; const n = document.getElementById('micNotice'); n.className = 'notice error'; n.textContent = msg; n.style.display = 'block'; }
      });
      ['me', 'partner'].forEach(who => {
        document.getElementById(who === 'me' ? 'micMe' : 'micPartner').addEventListener('click', () => {
          if (busy) return;
          if (recognizer.listening) { recognizer.stop(); return; }
          document.getElementById('micNotice').style.display = 'none';
          activeWho = who;
          recognizer.setLang(MODE[who].src);
          recognizer.start();
        });
      });
    }

    /* ---- シート（ピン留め／言葉の検索） ---- */
    function openSheet(id) {
      document.getElementById('backdrop').classList.add('open');
      const s = document.getElementById(id); s.classList.add('open'); s.setAttribute('aria-hidden', 'false');
    }
    function closeSheets() {
      document.getElementById('backdrop').classList.remove('open');
      document.querySelectorAll('.sheet').forEach(s => { s.classList.remove('open'); s.setAttribute('aria-hidden', 'true'); });
    }

    function iconBtn(label, aria, fn) { const b = document.createElement('button'); b.className = 'icon-btn'; b.textContent = label; b.setAttribute('aria-label', aria); b.addEventListener('click', fn); return b; }

    function renderPins() {
      const box = document.getElementById('pinList'); box.innerHTML = '';
      const pins = EA.getPins();
      if (!pins.length) { box.innerHTML = '<div class="chat-empty">まだありません。予習プラン・表現集・気持ちから探す・話題カードの 📍 を押すと、ここに集まります。</div>'; return; }
      pins.forEach(p => {
        const d = document.createElement('div'); d.className = 'item-row';
        const e = document.createElement('div'); e.className = 'en-text'; e.textContent = p.en;
        if (p.used.length) { const u = document.createElement('span'); u.className = 'used-badge'; u.textContent = '使えた ' + p.used.length + '回'; e.appendChild(u); }
        const ja = document.createElement('div'); ja.className = 'ja-text'; ja.textContent = p.ja;
        const kana = document.createElement('div'); kana.className = 'kana-line'; EA.renderKana(kana, p.en);
        const act = document.createElement('div'); act.style.cssText = 'display:flex; gap:2px; margin-top:0.3rem; align-items:center;';
        act.appendChild(iconBtn('🔊', '再生', () => EA.speak(p.en, 'en-US', 1.0)));
        act.appendChild(iconBtn('🐢', 'ゆっくり再生', () => EA.speak(p.en, 'en-US', 0.7)));
        const used = document.createElement('button'); used.className = 'tiny-btn'; used.textContent = '✅ 使えた！';
        used.addEventListener('click', () => { EA.markPinUsed(p.en); EA.updateStreakBadge(); toast('記録しました 🎉'); renderPins(); });
        act.appendChild(used);
        act.appendChild(iconBtn('🗑', 'ピン留めを外す', () => { EA.togglePin(p.en, p.ja); renderPins(); }));
        d.appendChild(e); d.appendChild(ja); d.appendChild(kana); d.appendChild(act); box.appendChild(d);
      });
    }

    function finderCard(en, ja) {
      const d = document.createElement('div'); d.className = 'item-row';
      const e = document.createElement('div'); e.className = 'en-text'; e.textContent = en;
      const j = document.createElement('div'); j.className = 'ja-text'; j.textContent = ja;
      const kana = document.createElement('div'); kana.className = 'kana-line'; EA.renderKana(kana, en);
      const act = document.createElement('div'); act.style.cssText = 'display:flex; gap:2px; margin-top:0.3rem;';
      act.appendChild(iconBtn('🔊', '再生', () => EA.speak(en, 'en-US', 1.0)));
      const pin = iconBtn(EA.isPinned(en) ? '📌' : '📍', 'ピン留め', () => { const on = EA.togglePin(en, ja); pin.textContent = on ? '📌' : '📍'; toast(on ? 'ピン留めしました' : 'ピン留めを外しました'); });
      act.appendChild(pin);
      const save = iconBtn(EA.hasPhrase(en) ? '✅' : '💾', 'マイ単語に保存', () => { const r = EA.addCustomPhrase(en, ja); if (r.added) { save.textContent = '✅'; toast('マイ単語に保存しました'); } else toast('すでに保存されています'); });
      act.appendChild(save);
      d.appendChild(e); d.appendChild(j); d.appendChild(kana); d.appendChild(act); return d;
    }

    async function runFinder() {
      const q = document.getElementById('finderInput').value.trim();
      const box = document.getElementById('finderResults'); box.innerHTML = '';
      if (!q) return;
      const nq = EA.normJa(q), lq = q.toLowerCase(), seen = new Set(), local = [];
      const push = (en, ja) => { const k = en.toLowerCase(); if (seen.has(k)) return; if (EA.normJa(ja).includes(nq) || k.includes(lq)) { seen.add(k); local.push([en, ja]); } };
      EA.getAllPhrases().forEach(p => push(p[1], p[2]));
      CONTENT.SCENES.forEach(s => s.p.forEach(p => push(p[0], p[1])));
      Object.values(CONTENT.MEET).forEach(m => m.p.forEach(p => push(p[0], p[1])));
      if (local.length) {
        const t = document.createElement('div'); t.className = 'section-title'; t.textContent = '📚 フレーズから'; box.appendChild(t);
        local.slice(0, 8).forEach(x => box.appendChild(finderCard(x[0], x[1])));
      }
      const t2 = document.createElement('div'); t2.className = 'section-title'; t2.textContent = '🌐 翻訳の候補'; box.appendChild(t2);
      const status = document.createElement('div'); status.className = 'muted'; status.textContent = '検索中...'; box.appendChild(status);
      const r = await EA.translate(q, 'ja|en');
      status.remove();
      if (!r.ok) { const m = document.createElement('div'); m.className = 'muted'; m.textContent = r.text; box.appendChild(m); if (!local.length) { /* フレーズの候補なし */ } return; }
      const cands = [r.text].concat(r.alts).filter((x, i, a) => x && a.findIndex(y => y.toLowerCase() === x.toLowerCase()) === i && x.length <= 80).slice(0, 5);
      cands.forEach(c => box.appendChild(finderCard(c, q)));
    }

    function syncOnline() { document.getElementById('offlineNotice').style.display = navigator.onLine ? 'none' : 'block'; }

    document.addEventListener('DOMContentLoaded', () => {
      const prefs = EA.getPrefs();
      const bind = (id, key) => {
        const el = document.getElementById(id);
        el.checked = !!prefs[key];
        el.addEventListener('change', () => { EA.setPref(key, el.checked); if (key === 'kana') renderChat(); });
      };
      bind('optSpeakMine', 'speakMine'); bind('optSpeakPartner', 'speakPartner'); bind('optKana', 'kana');

      renderChat();
      setupMic();
      syncOnline();
      document.getElementById('openPins').addEventListener('click', () => { renderPins(); openSheet('pinSheet'); });
      document.getElementById('openFinder').addEventListener('click', () => { openSheet('finderSheet'); setTimeout(() => document.getElementById('finderInput').focus(), 300); });
      document.getElementById('backdrop').addEventListener('click', closeSheets);
      document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });
      document.getElementById('finderBtn').addEventListener('click', runFinder);
      document.getElementById('finderInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runFinder(); } });
      window.addEventListener('online', syncOnline);
      window.addEventListener('offline', syncOnline);

      const toggle = document.getElementById('textToggle');
      const row = document.getElementById('textRow');
      toggle.addEventListener('click', () => { row.classList.toggle('open'); if (row.classList.contains('open')) document.getElementById('textInput').focus(); });
      const input = document.getElementById('textInput');
      document.getElementById('sendMe').addEventListener('click', () => handleUtterance('me', input.value));
      document.getElementById('sendPartner').addEventListener('click', () => handleUtterance('partner', input.value));
    });

  </script>
</body>
</html>
