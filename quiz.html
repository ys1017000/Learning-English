<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>気持ちを伝える英語 - クイズ</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 80px;
    }
    header {
      background: var(--card-bg);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
      font-weight: bold;
      color: var(--primary);
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 0.75rem 0;
      border-top: 1px solid var(--border);
      z-index: 100;
    }
    nav a {
      color: #64748b;
      text-decoration: none;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    nav a.active { color: var(--primary); font-weight: bold; }
    .container { max-width: 600px; margin: 0 auto; padding: 1.5rem; }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      border: 1px solid var(--border);
    }
    .question { font-size: 1.2rem; font-weight: bold; margin-bottom: 1rem; color: #0f172a; }
    .options { display: flex; flex-direction: column; gap: 0.75rem; }
    .option-btn {
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover { background: #f1f5f9; border-color: var(--primary); }
    .feedback { margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; font-weight: bold; }
    .feedback.correct { background: #dcfce7; color: #15803d; }
    .feedback.wrong { background: #fee2e2; color: #b91c1c; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.85rem;
      background: var(--primary);
      color: white;
      text-align: center;
      border-radius: 8px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>❓ 3秒クイズ</header>

  <div class="container">
    <div class="card">
      <div id="categoryLabel" style="font-size:0.8rem; color:#64748b; margin-bottom:0.5rem;">カテゴリー</div>
      <div class="question" id="questionText">問題文を読み込み中...</div>
      <div class="options" id="optionsContainer"></div>
      <div class="feedback" id="feedbackArea"></div>
      <button class="btn" id="nextBtn" style="display:none;">次の問題へ</button>
    </div>
  </div>

  <nav>
    <a href="index.html">🏠 ホーム</a>
    <a href="quiz.html" class="active">❓ クイズ</a>
    <a href="writing.html">✍️ 英作文</a>
    <a href="speaking.html">🎙️ スピーキング</a>
    <a href="phrases.html">📚 表現集</a>
  </nav>

  <script>
    const phrases = [
  ["相手に感謝を伝えるとき", "Thank you for the note.", "メッセージをありがとうございます。"],
  ["相手に感謝を伝えるとき", "Thank you for opening up to me.", "私に心を開いて打ち明けてくれてありがとうございます。"],
  ["共感する", "I understand how you feel.", "お気持ちよく分かります。"],
  ["共感する", "That must have been hard.", "それは大変でしたね。"],
  ["共感する", "I know what you mean.", "仰ること、とてもよく分かります。"],
  ["励ます・応援する", "You got this!", "あなたならできますよ！ / 応援しています！"],
  ["励ます・応援する", "I'm always here for you.", "いつでも力になりますよ。"],
  ["励ます・応援する", "Don't be so hard on yourself.", "自分を責めすぎないでね。"],
  ["賛成・同意する", "I totally agree with you.", "全く同感です。"],
  ["賛成・同意する", "That makes sense.", "なるほど、理にかなっていますね。"],
  ["丁寧に断る", "I'd love to, but I have other plans.", "行きたいのですが、あいにく先約がありまして。"],
  ["丁寧に断る", "I'm afraid I can't make it.", "あいにく都合がつきそうにありません。"],
  ["自分の意見を言う", "In my opinion, it's worth a try.", "私の意見では、やってみる価値はあると思います。"],
  ["自分の意見を言う", "As far as I'm concerned, we should wait.", "私としては、待つべきだと思います。"],
  ["雑談・近況報告", "How have you been lately?", "最近どう過ごしていましたか？"],
  ["雑談・近況報告", "Nothing much, just the usual.", "相変わらず、普段通りですよ。"]
];

    let currentIndex = 0;
    let currentQuestion = null;

    function getStore() {
      try {
        return JSON.parse(localStorage.getItem('english_app_data')) || { studied: [], quizStats: { correct: 0, total: 0 }, history: {}, weaknesses: {} };
      } catch(e) {
        return { studied: [], quizStats: { correct: 0, total: 0 }, history: {}, weaknesses: {} };
      }
    }

    function saveStore(data) {
      localStorage.setItem('english_app_data', JSON.stringify(data));
    }

    function saveProgress(isCorrect, item) {
      if (!item || !Array.isArray(item)) return;
      const store = getStore();
      const todayStr = new Date().toISOString().split('T')[0];

      store.history = store.history || {};
      store.history[todayStr] = true;

      store.quizStats = store.quizStats || { correct: 0, total: 0 };
      store.quizStats.total += 1;
      if (isCorrect) {
        store.quizStats.correct += 1;
      } else {
        store.weaknesses = store.weaknesses || {};
        const cat = item[0] || "共通";
        store.weaknesses[cat] = (store.weaknesses[cat] || 0) + 1;
      }

      store.studied = store.studied || [];
      if (!store.studied.includes(item[1])) {
        store.studied.push(item[1]);
      }

      saveStore(store);
    }

    function loadQuestion() {
      const validPhrases = phrases.filter(p => Array.isArray(p) && p.length >= 3);
      if (validPhrases.length === 0) return;

      currentQuestion = validPhrases[Math.floor(Math.random() * validPhrases.length)];
      
      document.getElementById('categoryLabel').textContent = currentQuestion[0];
      document.getElementById('questionText').textContent = `「${currentQuestion[2]}」に対応する表現は？`;

      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';

      // Generate options
      const choices = [currentQuestion[1]];
      while (choices.length < 3) {
        const rand = validPhrases[Math.floor(Math.random() * validPhrases.length)][1];
        if (!choices.includes(rand)) choices.push(rand);
      }
      choices.sort(() => Math.random() - 0.5);

      const feedbackArea = document.getElementById('feedbackArea');
      feedbackArea.style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';

      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = choice;
        btn.addEventListener('click', () => handleAnswer(choice, btn));
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(choice, btn) {
      const isCorrect = (choice === currentQuestion[1]);
      const feedbackArea = document.getElementById('feedbackArea');
      
      saveProgress(isCorrect, currentQuestion);

      document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

      if (isCorrect) {
        feedbackArea.className = 'feedback correct';
        feedbackArea.textContent = '⭕ 正解です！';
      } else {
        feedbackArea.className = 'feedback wrong';
        feedbackArea.textContent = `❌ 残念！ 正解: ${currentQuestion[1]}`;
      }
      feedbackArea.style.display = 'block';
      document.getElementById('nextBtn').style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadQuestion();
      document.getElementById('nextBtn').addEventListener('click', loadQuestion);
    });
  </script>
</body>
</html>
