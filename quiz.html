<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>心をつなぐ英語表現 - クイズ</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="common.css?v=23">
</head>
<body>
  <header>
    <a href="index.html" class="logo">心をつなぐ英語表現</a>
    <span id="streakBadge" class="streak-badge">🔥 0日連続学習</span>
  </header>
  <div class="subnav">
    <a href="roadmap.html">🗺 計画</a>
    <a href="grammar.html">📖 文法</a>
    <a href="quiz.html" class="active" aria-current="page">❓ クイズ</a>
    <a href="writing.html">✍️ 英作文</a>
    <a href="speaking.html">🎙️ 発音</a>
    <a href="talk.html">💭 お題</a>
    <a href="addword.html">➕ 単語</a>
    <a href="phrases.html">📚 表現集</a>
  </div>
  <div class="container">
    <select id="genreSelect" class="genre-select-box" aria-label="出題ジャンル"></select>
    <select id="subSelect" class="genre-select-box" aria-label="マイ単語の分類" style="display:none; margin-top:-0.75rem;"></select>
    <div class="chip-row" id="modeChips" role="group" aria-label="出題のしかた" style="margin-bottom:0.75rem;">
      <button class="chip active" data-mode="quiz">📝 4択クイズ</button>
      <button class="chip" data-mode="drill">🗣 声に出すカード</button>
    </div>
    <div class="chip-row" id="drillSizeChips" role="group" aria-label="声に出すカードの枚数" style="display:none; margin-bottom:0.75rem;">
      <span class="muted" style="align-self:center; font-size:0.85rem;">枚数：</span>
      <button class="chip" data-size="10">10枚</button>
      <button class="chip" data-size="20">20枚</button>
      <button class="chip" data-size="0">全部</button>
    </div>
    <div class="card" id="drillCard" style="display:none;"></div>
    <div class="card" id="quizCard">
      <button class="fav-star-btn" id="quizFavBtn" aria-label="お気に入りに追加">★</button>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem; padding-right:2rem;">
        <span id="categoryLabel" style="font-size:0.8rem; color:#64748b;">カテゴリー</span>
        <span id="quizStepText" style="font-size:0.85rem; font-weight:bold; color:var(--primary);"></span>
      </div>
      <div class="progress-bar-container"><div class="progress-bar-fill" id="progressBarFill"></div></div>
      <div class="question" id="questionText">問題文を読み込み中...</div>
      <div class="options" id="optionsContainer"></div>
      <div class="feedback" id="feedbackArea" role="status"></div>
      <div id="quizPlay" style="display:none; justify-content:center; gap:6px; margin-top:0.5rem;"><button class="icon-btn" id="playAns" aria-label="正解の英語を再生">🔊</button><button class="icon-btn" id="slowAns" aria-label="ゆっくり再生">🐢</button></div>
      <button class="btn" id="nextBtn" style="display:none; margin-top:1rem;">次の問題へ</button>
    </div>
    <div class="card" id="resultCard" style="display:none; text-align:center;">
      <div style="font-size:2.5rem; margin-bottom:0.5rem;">🏆</div>
      <h2>クイズ完了！</h2>
      <div id="resultScoreText" style="font-size:1.4rem; font-weight:bold; color:var(--primary); margin:0.75rem 0;"></div>
      <p id="resultMessage" style="color:var(--text-muted); margin-bottom:1rem;"></p>
      <div id="missedBox" style="display:none; text-align:left; margin-bottom:1rem;"></div>
      <button class="btn" id="restartBtn">🔄 もう一度挑戦する</button>
      <button class="btn weak-cta" id="weakReviewBtn" style="display:none; margin-top:0.5rem;">🎯 苦手だけ復習する</button>
      <a href="index.html" class="btn btn-secondary" style="margin-top:0.5rem;">🏠 ホームへ戻る</a>
    </div>
  </div>

  <nav>
    <a href="index.html">🏠 ホーム</a>
    <a href="translator.html">💬 会話</a>
    <a href="plan.html">📅 予習</a>
    <a href="recap.html">📝 ふり返り</a>
    <a href="quiz.html" class="active" aria-current="page">✍️ 練習</a>
  </nav>
  <script src="common.js?v=43"></script>
  <script src="usage-data.js?v=31"></script>
  <script>
    const QUIZ_SIZE = 10;
    let quizSet = [], currentIndex = 0, score = 0, answered = false, missed = [];

    function currentItem() { return quizSet[currentIndex]; }
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    // 出題のしかた：4択クイズ（quiz）／声に出すカード（drill）。端末ごとに覚える
    let mode = new URLSearchParams(location.search).get('format') === 'drill' ? 'drill' : (EA.getPrefs().quizMode === 'drill' ? 'drill' : 'quiz');
    // 声に出すカードの枚数：10 / 20 / 0（全部）。端末ごとに覚える
    function drillSize() { const n = Number(EA.getPrefs().drillCount); return [10, 20, 0].includes(n) ? n : 10; }
    function refreshSizeChips(total) {
      const row = document.getElementById('drillSizeChips');
      row.style.display = mode === 'drill' ? '' : 'none';
      row.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', Number(c.dataset.size) === drillSize());
        if (c.dataset.size === '0') c.textContent = '全部' + (total ? '（' + total + '枚）' : '');
      });
    }
    function setMode(m) {
      mode = m; EA.setPref('quizMode', m);
      document.querySelectorAll('#modeChips .chip').forEach(c => c.classList.toggle('active', c.dataset.mode === m));
      startQuiz();
    }
    // マイ単語・フレーズは、例文欄の書き方から「分類」を取り出して絞り込めるようにする
    //   第3週カード12（送る）→「送る」／ DM 11/11: … →「DMの表現」／ （DM 11/11 の返信）→「DMの返信」
    const SUB_KEY = 'english_app_quiz_subcat';
    let subCat = '';
    try { subCat = localStorage.getItem(SUB_KEY) || ''; } catch (e) {}
    function subTag(p) {
      const ex = String(p[3] || '');
      let m = /^第\d+週カード\d+[（(](.+?)[）)]/.exec(ex);
      if (m) return m[1];
      m = /^〔(.+?)〕/.exec(ex);
      if (m) return m[1];
      if (/^DM \d+\/\d+/.test(ex)) return 'DMの表現';
      if (/DM \d+\/\d+ の返信/.test(ex)) return 'DMの返信';
      if (/^第\d+週カード/.test(ex)) return 'ロードマップ（分類なし）';
      return 'その他（単語など）';
    }
    function isCustomGenre(v) { return v === 'マイ単語・フレーズ'; }
    function refreshSub(select) {
      const box = document.getElementById('subSelect');
      if (!isCustomGenre(select.value)) { box.style.display = 'none'; return; }
      const pool = EA.getPhrasesFor(select.value), count = {};
      pool.forEach(p => { const t = subTag(p); count[t] = (count[t] || 0) + 1; });
      const tags = Object.keys(count).sort((a, b) => count[b] - count[a]);
      if (subCat && !count[subCat]) subCat = '';
      box.innerHTML = '<option value="">📂 すべての分類（' + pool.length + '）</option>' +
        tags.map(t => '<option value="' + EA.esc(t) + '">　' + EA.esc(t) + '（' + count[t] + '）</option>').join('');
      box.value = subCat;
      box.style.display = tags.length > 1 ? '' : 'none';
    }
    function poolFor(select) {
      const pool = EA.getPhrasesFor(select.value);
      return isCustomGenre(select.value) && subCat ? pool.filter(p => subTag(p) === subCat) : pool;
    }
    function startDrill(select) {
      document.getElementById('quizCard').style.display = 'none';
      document.getElementById('resultCard').style.display = 'none';
      const box = document.getElementById('drillCard');
      const pool = poolFor(select), n = drillSize();
      refreshSizeChips(pool.length);
      const items = n ? shuffle(pool).slice(0, n) : shuffle(pool);
      let label = select.options[select.selectedIndex] ? select.options[select.selectedIndex].textContent.replace(/（.*?）\s*$/, '') : '';
      if (isCustomGenre(select.value) && subCat) label += '・' + subCat;
      EA.cardDrill(box, { title: label, items, record: true });
    }

    function startQuiz() {
      const select = document.getElementById('genreSelect');
      if (!EA.ensureNonEmpty(select)) return;
      refreshSub(select);
      document.querySelectorAll('#modeChips .chip').forEach(c => c.classList.toggle('active', c.dataset.mode === mode));
      if (mode === 'drill') { startDrill(select); return; }
      refreshSizeChips(0);
      document.getElementById('drillCard').style.display = 'none';
      quizSet = shuffle(poolFor(select)).slice(0, QUIZ_SIZE);
      currentIndex = 0; score = 0; missed = [];
      document.getElementById('quizCard').style.display = 'block';
      document.getElementById('resultCard').style.display = 'none';
      showQuestion();
    }

    // 選択肢：同じジャンルから優先して選ぶ（紛らわしい＝学習になる）。同じ英文・同じ日本語訳は除外
    function buildChoices(item) {
      const all = EA.getAllPhrases();
      const usable = p => p[1] !== item[1] && p[2] !== item[2];
      const same = shuffle(all.filter(p => usable(p) && p[0] === item[0]));
      const other = shuffle(all.filter(p => usable(p) && p[0] !== item[0]));
      const picked = [item[1]];
      same.concat(other).forEach(p => { if (picked.length < 3 && !picked.includes(p[1])) picked.push(p[1]); });
      return shuffle(picked);
    }

    function refreshFav() {
      const item = currentItem();
      const btn = document.getElementById('quizFavBtn');
      const on = !!item && EA.isFavorite(item[1]);
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    function showQuestion() {
      if (currentIndex >= quizSet.length) { showResult(); return; }
      answered = false;
      const item = currentItem();
      document.getElementById('quizStepText').textContent = '第 ' + (currentIndex + 1) + ' 問 / 全 ' + quizSet.length + ' 問';
      document.getElementById('progressBarFill').style.width = (currentIndex / quizSet.length * 100) + '%';
      document.getElementById('categoryLabel').textContent = item[0];
      document.getElementById('questionText').textContent = '「' + EA.splitJa(item[2]).main + '」に対応する自然な表現は？';
      document.getElementById('feedbackArea').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('quizPlay').style.display = 'none';
      refreshFav();

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      buildChoices(item).forEach(text => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = text;
        btn.addEventListener('click', () => onAnswer(btn, text));
        container.appendChild(btn);
      });
    }

    function onAnswer(btn, text) {
      if (answered) return;
      answered = true;
      const item = currentItem();
      const ok = text === item[1];
      if (ok) score++; else missed.push(item);
      EA.recordResult(item, ok, 'quiz');   // 正答率・苦手フレーズ・学習カレンダーに反映
      EA.updateStreakBadge();

      document.querySelectorAll('.option-btn').forEach(b => {
        b.disabled = true;
        if (b.textContent === item[1]) b.classList.add('correct');
      });
      if (!ok) btn.classList.add('wrong');

      const { note } = EA.splitJa(item[2]);
      const extra = [note ? '💡 ' + note : '', item[3] ? '例文: ' + item[3] : ''].filter(Boolean);
      const fb = document.getElementById('feedbackArea');
      fb.className = 'feedback ' + (ok ? 'correct' : 'wrong');
      fb.textContent = ok ? '⭕ 正解です！' : '❌ 残念！ 正解: ' + item[1];
      extra.forEach(t => { const s = document.createElement('span'); s.className = 'sub'; s.textContent = t; fb.appendChild(s); });
      { const u = EA.usageFor(item[1]); if (u) { const s = document.createElement('span'); s.className = 'sub usage-line'; s.textContent = '🎬 場面：' + u; fb.appendChild(s); } }
      fb.style.display = 'block';

      const next = document.getElementById('nextBtn');
      next.textContent = currentIndex + 1 >= quizSet.length ? '結果を見る' : '次の問題へ';
      next.style.display = 'block';
      const qp = document.getElementById('quizPlay'); qp.style.display = 'flex';
      document.getElementById('playAns').onclick = () => EA.speak(item[1], 'en-US', 1.0);
      document.getElementById('slowAns').onclick = () => EA.speak(item[1], 'en-US', 0.7);
      EA.autoSpeak(item[1], 'en-US', 1.0);
    }

    function showResult() {
      document.getElementById('quizCard').style.display = 'none';
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('progressBarFill').style.width = '100%';
      const total = quizSet.length;
      const pct = total ? Math.round(score / total * 100) : 0;
      document.getElementById('resultScoreText').textContent = total + ' 問中 ' + score + ' 問 正解！（' + pct + '%）';
      document.getElementById('resultMessage').textContent =
        pct === 100 ? 'パーフェクト！すばらしいです 🎉' :
        pct >= 70 ? 'いい調子です！間違えたものを復習しましょう。' :
        'ここからが伸びしろ。間違えたフレーズは「苦手」に登録されました。';

      const box = document.getElementById('missedBox');
      box.innerHTML = '';
      if (missed.length) {
        const h = document.createElement('div');
        h.style.cssText = 'font-weight:bold; margin-bottom:0.4rem;';
        h.textContent = '間違えたフレーズ';
        box.appendChild(h);
        missed.forEach(p => {
          const d = document.createElement('div');
          d.className = 'phrase-card';
          const en = document.createElement('div'); en.className = 'en-text'; en.textContent = p[1];
          const ja = document.createElement('div'); ja.className = 'ja-text'; ja.textContent = p[2];
          d.appendChild(en); d.appendChild(ja);
          box.appendChild(d);
        });
        box.style.display = 'block';
      } else { box.style.display = 'none'; }
      document.getElementById('weakReviewBtn').style.display = EA.getWeakPhrases().length ? 'block' : 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('genreSelect');
      EA.populateGenreSelect(select);
      startQuiz();
      select.addEventListener('change', startQuiz);
      document.getElementById('subSelect').addEventListener('change', e => {
        subCat = e.target.value;
        try { localStorage.setItem(SUB_KEY, subCat); } catch (err) {}
        startQuiz();
      });
      document.getElementById('modeChips').addEventListener('click', e => { const c = e.target.closest('[data-mode]'); if (c && c.dataset.mode !== mode) setMode(c.dataset.mode); });
      document.getElementById('drillSizeChips').addEventListener('click', e => { const c = e.target.closest('[data-size]'); if (!c) return; EA.setPref('drillCount', Number(c.dataset.size)); startQuiz(); });
      document.getElementById('nextBtn').addEventListener('click', () => { currentIndex++; showQuestion(); });
      document.getElementById('restartBtn').addEventListener('click', startQuiz);
      document.getElementById('weakReviewBtn').addEventListener('click', () => {
        EA.populateGenreSelect(select);   // 苦手件数を最新に
        EA.setGenre(select, 'WEAK');
        startQuiz();
      });
      document.getElementById('quizFavBtn').addEventListener('click', () => {
        const item = currentItem();
        if (!item) return;
        EA.toggleFavorite(item[1]);
        refreshFav();
      });
    });

  </script>
</body>
</html>
