<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>気持ちを伝える英語 - 表現集</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 80px;
    }
    header {
      background: var(--card-bg);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
      font-weight: bold;
      color: var(--primary);
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 0.75rem 0;
      border-top: 1px solid var(--border);
      z-index: 100;
    }
    nav a {
      color: #64748b;
      text-decoration: none;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    nav a.active { color: var(--primary); font-weight: bold; }
    .container { max-width: 600px; margin: 0 auto; padding: 1.5rem; }
    .search-box {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }
    .phrase-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 0.75rem;
      border: 1px solid var(--border);
    }
    .category-badge {
      display: inline-block;
      font-size: 0.75rem;
      background: #e0e7ff;
      color: #3730a3;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 0.4rem;
    }
    .en-text { font-size: 1.05rem; font-weight: bold; color: #0f172a; }
    .ja-text { font-size: 0.9rem; color: #475569; margin-top: 0.2rem; }
  </style>
</head>
<body>
  <header>📚 気持ちを伝える表現集</header>

  <div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="キーワード検索 (例: 感謝, happy, agree)...">
    <div id="phrasesList"></div>
  </div>

  <nav>
    <a href="index.html">🏠 ホーム</a>
    <a href="quiz.html">❓ クイズ</a>
    <a href="writing.html">✍️ 英作文</a>
    <a href="speaking.html">🎙️ スピーキング</a>
    <a href="phrases.html" class="active">📚 表現集</a>
  </nav>

  <script>
    const phrases = [
  ["相手に感謝を伝えるとき", "Thank you for the note.", "メッセージをありがとうございます。"],
  ["相手に感謝を伝えるとき", "Thank you for opening up to me.", "私に心を開いて打ち明けてくれてありがとうございます。"],
  ["共感する", "I understand how you feel.", "お気持ちよく分かります。"],
  ["共感する", "That must have been hard.", "それは大変でしたね。"],
  ["共感する", "I know what you mean.", "仰ること、とてもよく分かります。"],
  ["励ます・応援する", "You got this!", "あなたならできますよ！ / 応援しています！"],
  ["励ます・応援する", "I'm always here for you.", "いつでも力になりますよ。"],
  ["励ます・応援する", "Don't be so hard on yourself.", "自分を責めすぎないでね。"],
  ["賛成・同意する", "I totally agree with you.", "全く同感です。"],
  ["賛成・同意する", "That makes sense.", "なるほど、理にかなっていますね。"],
  ["丁寧に断る", "I'd love to, but I have other plans.", "行きたいのですが、あいにく先約がありまして。"],
  ["丁寧に断る", "I'm afraid I can't make it.", "あいにく都合がつきそうにありません。"],
  ["自分の意見を言う", "In my opinion, it's worth a try.", "私の意見では、やってみる価値はあると思います。"],
  ["自分の意見を言う", "As far as I'm concerned, we should wait.", "私としては、待つべきだと思います。"],
  ["雑談・近況報告", "How have you been lately?", "最近どう過ごしていましたか？"],
  ["雑談・近況報告", "Nothing much, just the usual.", "相変わらず、普段通りですよ。"]
];

    function renderPhrases(filterText = '') {
      const container = document.getElementById('phrasesList');
      if (!container) return;
      container.innerHTML = '';

      const query = filterText.toLowerCase().trim();
      const validPhrases = phrases.filter(p => Array.isArray(p) && p.length >= 3);

      const filtered = validPhrases.filter(p => {
        return p[0].toLowerCase().includes(query) ||
               p[1].toLowerCase().includes(query) ||
               p[2].toLowerCase().includes(query);
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#64748b; padding:2rem;">該当する表現が見つかりませんでした。</div>';
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'phrase-card';
        card.innerHTML = `
          <span class="category-badge">${p[0]}</span>
          <div class="en-text">${p[1]}</div>
          <div class="ja-text">${p[2]}</div>
        `;
        container.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPhrases();

      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          renderPhrases(e.target.value);
        });
      }
    });
  </script>
</body>
</html>
