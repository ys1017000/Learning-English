<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>心をつなぐ英語表現 - 表現集</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="common.css?v=12">
</head>
<body>
  <header>
    <a href="index.html" class="logo">心をつなぐ英語表現</a>
    <span id="streakBadge" class="streak-badge">🔥 0日連続学習</span>
  </header>
  <div class="subnav">
    <a href="roadmap.html">🗺 計画</a>
    <a href="grammar.html">📖 文法</a>
    <a href="quiz.html">❓ クイズ</a>
    <a href="writing.html">✍️ 英作文</a>
    <a href="speaking.html">🎙️ 発音</a>
    <a href="addword.html">➕ 単語</a>
    <a href="phrases.html" class="active" aria-current="page">📚 表現集</a>
  </div>
  <div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="キーワード検索（英語・日本語・ジャンル）..." aria-label="キーワード検索">
    <div id="resultCount" class="muted" style="margin-bottom:0.75rem;"></div>
    <div id="phrasesList"></div>
  </div>

  <nav>
    <a href="index.html">🏠 ホーム</a>
    <a href="translator.html">💬 会話</a>
    <a href="plan.html">📅 予習</a>
    <a href="recap.html">📝 ふり返り</a>
    <a href="quiz.html" class="active" aria-current="page">✍️ 練習</a>
  </nav>
  <script src="common.js?v=12"></script>
  <script src="usage-data.js?v=2"></script>
  <script>
    function renderPhrases(query) {
      const q = (query || '').trim().toLowerCase();
      const container = document.getElementById('phrasesList');
      container.innerHTML = '';
      const favs = EA.getStore().favorites;
      const filtered = EA.getAllPhrases().filter(p =>
        !q || p[1].toLowerCase().includes(q) || p[2].toLowerCase().includes(q) || p[0].toLowerCase().includes(q) || (p[3] || '').toLowerCase().includes(q));
      document.getElementById('resultCount').textContent = filtered.length + ' 件';
      if (!filtered.length) {
        container.innerHTML = '<div class="muted" style="text-align:center; padding:1.5rem;">該当するフレーズがありません。</div>';
        return;
      }
      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'phrase-card';
        const badge = document.createElement('span');
        badge.className = 'category-badge' + (p[0] === EA.CUSTOM_CAT ? ' custom' : '');
        badge.textContent = p[0];
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; gap:8px;';
        const en = document.createElement('div'); en.className = 'en-text'; en.textContent = p[1];
        const actions = document.createElement('div');
        actions.style.cssText = 'display:flex; gap:4px; flex-shrink:0;';
        const fav = document.createElement('button');
        fav.textContent = '★';
        fav.setAttribute('aria-label', 'お気に入り');
        fav.style.cssText = 'background:none; border:none; cursor:pointer; font-size:1.3rem; color:' + (favs.includes(p[1]) ? 'var(--fav)' : '#cbd5e1') + ';';
        fav.addEventListener('click', () => { const on = EA.toggleFavorite(p[1]); fav.style.color = on ? 'var(--fav)' : '#cbd5e1'; });
        const play = document.createElement('button');
        play.textContent = '🔊';
        play.setAttribute('aria-label', '音声を再生');
        play.style.cssText = 'background:none; border:none; cursor:pointer; font-size:1.2rem;';
        play.addEventListener('click', () => EA.speak(p[1], 'en-US', 1.0));
        const pin = document.createElement('button');
        pin.textContent = EA.isPinned(p[1]) ? '📌' : '📍';
        pin.setAttribute('aria-label', 'ピン留め');
        pin.style.cssText = 'background:none; border:none; cursor:pointer; font-size:1.2rem;';
        pin.addEventListener('click', () => { const on = EA.togglePin(p[1], p[2]); pin.textContent = on ? '📌' : '📍'; EA.toast(on ? 'ピン留めしました（会話画面から開けます）' : 'ピン留めを外しました'); });
        actions.appendChild(fav); actions.appendChild(pin); actions.appendChild(play);
        row.appendChild(en); row.appendChild(actions);
        const ja = document.createElement('div'); ja.className = 'ja-text'; ja.textContent = p[2];
        card.appendChild(badge); card.appendChild(row); card.appendChild(ja);
        if (p[3]) { const ex = document.createElement('div'); ex.className = 'ex-text'; ex.textContent = '例文: ' + p[3]; card.appendChild(ex); }
        { const u = EA.usageFor(p[1]); if (u) { const us = document.createElement('div'); us.className = 'usage-line'; us.textContent = '🎬 場面：' + u; card.appendChild(us); } }
        container.appendChild(card);
      });
    }
    document.addEventListener('DOMContentLoaded', () => {
      renderPhrases('');
      document.getElementById('searchInput').addEventListener('input', e => renderPhrases(e.target.value));
    });

  </script>
</body>
</html>
