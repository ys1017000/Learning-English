<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>気持ちを伝える英語 - 英作文</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 80px;
    }
    header {
      background: var(--card-bg);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
      font-weight: bold;
      color: var(--primary);
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 0.75rem 0;
      border-top: 1px solid var(--border);
      z-index: 100;
    }
    nav a {
      color: #64748b;
      text-decoration: none;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    nav a.active { color: var(--primary); font-weight: bold; }
    .container { max-width: 600px; margin: 0 auto; padding: 1.5rem; }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      border: 1px solid var(--border);
    }
    .question { font-size: 1.1rem; font-weight: bold; margin-bottom: 1rem; }
    textarea {
      width: 100%;
      height: 100px;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
      resize: vertical;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.85rem;
      background: var(--primary);
      color: white;
      text-align: center;
      border-radius: 8px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .answer-box {
      margin-top: 1rem;
      padding: 1rem;
      background: #f1f5f9;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <header>✍️ 実践英作文</header>

  <div class="container">
    <div class="card">
      <div id="categoryLabel" style="font-size:0.8rem; color:#64748b; margin-bottom:0.5rem;">カテゴリー</div>
      <div class="question" id="promptText">問題文を読み込み中...</div>
      <textarea id="userInput" placeholder="ここに英語を入力してみましょう..."></textarea>
      <button class="btn" id="showAnswerBtn">模範解答を見る</button>
      
      <div class="answer-box" id="answerArea">
        <div style="font-size:0.85rem; color:#64748b;">模範解答:</div>
        <div id="modelAnswer" style="font-size:1.1rem; font-weight:bold; color:var(--primary); margin-top:0.25rem;"></div>
        <button class="btn" id="nextBtn" style="margin-top:1rem; background:#475569;">次の問題へ</button>
      </div>
    </div>
  </div>

  <nav>
    <a href="index.html">🏠 ホーム</a>
    <a href="quiz.html">❓ クイズ</a>
    <a href="writing.html" class="active">✍️ 英作文</a>
    <a href="speaking.html">🎙️ スピーキング</a>
    <a href="phrases.html">📚 表現集</a>
  </nav>

  <script>
    const phrases = [
  ["相手に感謝を伝えるとき", "Thank you for the note.", "メッセージをありがとうございます。"],
  ["相手に感謝を伝えるとき", "Thank you for opening up to me.", "私に心を開いて打ち明けてくれてありがとうございます。"],
  ["共感する", "I understand how you feel.", "お気持ちよく分かります。"],
  ["共感する", "That must have been hard.", "それは大変でしたね。"],
  ["共感する", "I know what you mean.", "仰ること、とてもよく分かります。"],
  ["励ます・応援する", "You got this!", "あなたならできますよ！ / 応援しています！"],
  ["励ます・応援する", "I'm always here for you.", "いつでも力になりますよ。"],
  ["励ます・応援する", "Don't be so hard on yourself.", "自分を責めすぎないでね。"],
  ["賛成・同意する", "I totally agree with you.", "全く同感です。"],
  ["賛成・同意する", "That makes sense.", "なるほど、理にかなっていますね。"],
  ["丁寧に断る", "I'd love to, but I have other plans.", "行きたいのですが、あいにく先約がありまして。"],
  ["丁寧に断る", "I'm afraid I can't make it.", "あいにく都合がつきそうにありません。"],
  ["自分の意見を言う", "In my opinion, it's worth a try.", "私の意見では、やってみる価値はあると思います。"],
  ["自分の意見を言う", "As far as I'm concerned, we should wait.", "私としては、待つべきだと思います。"],
  ["雑談・近況報告", "How have you been lately?", "最近どう過ごしていましたか？"],
  ["雑談・近況報告", "Nothing much, just the usual.", "相変わらず、普段通りですよ。"]
];
    let currentItem = null;

    function markStudy(item) {
      if (!item || !Array.isArray(item)) return;
      try {
        const store = JSON.parse(localStorage.getItem('english_app_data')) || { studied: [], history: {} };
        store.studied = Array.isArray(store.studied) ? store.studied : [];
        if (!store.studied.includes(item[1])) {
          store.studied.push(item[1]);
        }
        const todayStr = new Date().toISOString().split('T')[0];
        store.history = store.history || {};
        store.history[todayStr] = true;
        localStorage.setItem('english_app_data', JSON.stringify(store));
      } catch(e) {
        console.error("Save error: ", e);
      }
    }

    function loadWritingPrompt() {
      const validPhrases = phrases.filter(p => Array.isArray(p) && p.length >= 3);
      if (validPhrases.length === 0) return;

      currentItem = validPhrases[Math.floor(Math.random() * validPhrases.length)];
      
      document.getElementById('categoryLabel').textContent = currentItem[0];
      document.getElementById('promptText').textContent = `「${currentItem[2]}」を英語で書いてみましょう。`;
      document.getElementById('userInput').value = '';
      document.getElementById('answerArea').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadWritingPrompt();

      document.getElementById('showAnswerBtn').addEventListener('click', () => {
        if (!currentItem) return;
        markStudy(currentItem);
        document.getElementById('modelAnswer').textContent = currentItem[1];
        document.getElementById('answerArea').style.display = 'block';
      });

      document.getElementById('nextBtn').addEventListener('click', loadWritingPrompt);
    });
  </script>
</body>
</html>
