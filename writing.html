<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>心をつなぐ英語表現 - 英作文</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="common.css?v=23">
</head>
<body>
  <header>
    <a href="index.html" class="logo">心をつなぐ英語表現</a>
    <span id="streakBadge" class="streak-badge">🔥 0日連続学習</span>
  </header>
  <div class="subnav">
    <a href="roadmap.html">🗺 計画</a>
    <a href="grammar.html">📖 文法</a>
    <a href="quiz.html">❓ クイズ</a>
    <a href="writing.html" class="active" aria-current="page">✍️ 英作文</a>
    <a href="speaking.html">🎙️ 発音</a>
    <a href="talk.html">💭 お題</a>
    <a href="addword.html">➕ 単語</a>
    <a href="phrases.html">📚 表現集</a>
  </div>
  <div class="container">
    <select id="genreSelect" class="genre-select-box" aria-label="出題ジャンル"></select>
    <div class="card">
      <button class="fav-star-btn" id="writingFavBtn" aria-label="お気に入りに追加">★</button>
      <div id="categoryLabel" style="font-size:0.8rem; color:#64748b; margin-bottom:0.5rem; padding-right:2rem;">カテゴリー</div>
      <div class="question" id="promptText">問題文を読み込み中...</div>
      <textarea id="userInput" placeholder="ここに英語を入力してみましょう..." autocapitalize="sentences" spellcheck="false"></textarea>
      <button class="btn" id="showAnswerBtn">模範解答を見る</button>
      <div class="answer-box" id="answerArea">
        <div style="font-size:0.85rem; color:#64748b;">模範解答:</div>
        <div id="modelAnswer" style="font-size:1.1rem; font-weight:bold; color:var(--primary); margin-top:0.25rem;"></div>
        <div style="display:flex; gap:6px; margin-top:0.35rem;"><button class="icon-btn" id="playModel" aria-label="模範解答を再生">🔊</button><button class="icon-btn" id="slowModel" aria-label="ゆっくり再生">🐢</button></div>
        <div id="modelNote" class="ex-text"></div>
        <div id="diffBox" style="display:none; margin-top:0.75rem;">
          <div style="font-size:0.8rem; color:#64748b;">あなたの回答との照合（<span id="diffScore"></span>）</div>
          <div class="word-chips" id="diffChips" style="justify-content:flex-start;"></div>
        </div>
        <div style="display:flex; gap:8px; margin-top:1rem;" id="selfCheckRow">
          <button class="btn" id="okBtn" style="background:#16a34a; flex:1;">✅ 書けた</button>
          <button class="btn" id="ngBtn" style="background:#be123c; flex:1;">🔁 苦手</button>
        </div>
        <div id="selfCheckDone" class="muted" style="display:none; margin-top:0.75rem; text-align:center;"></div>
        <button class="btn" id="nextBtn" style="margin-top:1rem; background:#475569;">次の問題へ</button>
      </div>
    </div>
  </div>

  <nav>
    <a href="index.html">🏠 ホーム</a>
    <a href="translator.html">💬 会話</a>
    <a href="plan.html">📅 予習</a>
    <a href="recap.html">📝 ふり返り</a>
    <a href="quiz.html" class="active" aria-current="page">✍️ 練習</a>
  </nav>
  <script src="common.js?v=33"></script>
  <script src="usage-data.js?v=23"></script>
  <script>
    let currentItem = null, selfChecked = false;

    function loadPrompt() {
      const select = document.getElementById('genreSelect');
      if (!EA.ensureNonEmpty(select)) return;
      const list = EA.getPhrasesFor(select.value);
      // 直前と同じ問題が続かないようにする
      let next = list[Math.floor(Math.random() * list.length)];
      if (list.length > 1) { let guard = 0; while (currentItem && next[1] === currentItem[1] && guard++ < 10) next = list[Math.floor(Math.random() * list.length)]; }
      currentItem = next;
      selfChecked = false;
      document.getElementById('categoryLabel').textContent = currentItem[0];
      document.getElementById('promptText').textContent = '「' + EA.splitJa(currentItem[2]).main + '」を英語で書いてみましょう。';
      document.getElementById('userInput').value = '';
      document.getElementById('answerArea').style.display = 'none';
      document.getElementById('showAnswerBtn').style.display = 'block';
      refreshFav();
    }

    function refreshFav() {
      const btn = document.getElementById('writingFavBtn');
      const on = !!currentItem && EA.isFavorite(currentItem[1]);
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    function showAnswer() {
      if (!currentItem) return;
      EA.markStudied(currentItem);
      EA.updateStreakBadge();
      document.getElementById('modelAnswer').textContent = currentItem[1];
      const { note } = EA.splitJa(currentItem[2]);
      document.getElementById('modelNote').textContent = [note ? '💡 ' + note : '', currentItem[3] ? '例文: ' + currentItem[3] : ''].filter(Boolean).join('  /  ');
      EA.renderUsage(document.getElementById('modelNote'), currentItem[1]);

      // 入力があれば単語単位で照合（別解もあり得るので参考表示。判定は自己採点）
      const typed = document.getElementById('userInput').value.trim();
      const diffBox = document.getElementById('diffBox');
      if (typed) {
        const r = EA.compareText(currentItem[1], typed);
        document.getElementById('diffScore').textContent = '一致度 ' + r.score + '%';
        const chips = document.getElementById('diffChips');
        chips.innerHTML = '';
        r.words.forEach(w => { const s = document.createElement('span'); s.className = 'word-chip ' + w.status; s.textContent = w.text; chips.appendChild(s); });
        diffBox.style.display = 'block';
      } else { diffBox.style.display = 'none'; }

      document.getElementById('selfCheckRow').style.display = 'flex';
      document.getElementById('selfCheckDone').style.display = 'none';
      document.getElementById('answerArea').style.display = 'block';
      document.getElementById('showAnswerBtn').style.display = 'none';
      EA.autoSpeak(currentItem[1], 'en-US', 1.0);
    }

    function selfCheck(ok) {
      if (!currentItem || selfChecked) return;
      selfChecked = true;
      EA.recordResult(currentItem, ok);
      EA.updateStreakBadge();
      document.getElementById('selfCheckRow').style.display = 'none';
      const done = document.getElementById('selfCheckDone');
      done.textContent = ok ? '✅ 記録しました。' : '🔁 苦手フレーズに登録しました。ホームの「弱点克服モード」で復習できます。';
      done.style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('playModel').addEventListener('click', () => { if (currentItem) EA.speak(currentItem[1], 'en-US', 1.0); });
      document.getElementById('slowModel').addEventListener('click', () => { if (currentItem) EA.speak(currentItem[1], 'en-US', 0.7); });
      const select = document.getElementById('genreSelect');
      EA.populateGenreSelect(select);
      loadPrompt();
      select.addEventListener('change', loadPrompt);
      document.getElementById('showAnswerBtn').addEventListener('click', showAnswer);
      document.getElementById('okBtn').addEventListener('click', () => selfCheck(true));
      document.getElementById('ngBtn').addEventListener('click', () => selfCheck(false));
      document.getElementById('nextBtn').addEventListener('click', loadPrompt);
      document.getElementById('writingFavBtn').addEventListener('click', () => { if (currentItem) { EA.toggleFavorite(currentItem[1]); refreshFav(); } });
    });

  </script>
</body>
</html>
