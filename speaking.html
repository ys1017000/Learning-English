<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>心をつなぐ英語表現 - 発音チェック</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="common.css?v=15">
</head>
<body>
  <header>
    <a href="index.html" class="logo">心をつなぐ英語表現</a>
    <span id="streakBadge" class="streak-badge">🔥 0日連続学習</span>
  </header>
  <div class="subnav">
    <a href="roadmap.html">🗺 計画</a>
    <a href="grammar.html">📖 文法</a>
    <a href="quiz.html">❓ クイズ</a>
    <a href="writing.html">✍️ 英作文</a>
    <a href="speaking.html" class="active" aria-current="page">🎙️ 発音</a>
    <a href="addword.html">➕ 単語</a>
    <a href="phrases.html">📚 表現集</a>
  </div>
  <div class="container">
    <select id="genreSelect" class="genre-select-box" aria-label="出題ジャンル"></select>
    <div class="card" style="text-align:center;">
      <button class="fav-star-btn" id="speakingFavBtn" aria-label="お気に入りに追加">★</button>
      <div id="categoryLabel" style="font-size:0.8rem; color:#64748b; margin-bottom:0.5rem; padding-right:2rem;">カテゴリー</div>
      <div class="question" id="promptText">問題文を読み込み中...</div>
      <div style="background:#e0e7ff; padding:0.75rem; border-radius:8px; margin-bottom:1rem;">
        <button class="btn" id="playNativeBtn" style="background:#4338ca; font-size:0.95rem;">🔊 ネイティブお手本音声を聞く</button>
        <div class="speed-controls">
          <span style="font-size:0.75rem; color:var(--text-muted); line-height:24px;">再生速度:</span>
          <button class="speed-btn" data-speed="0.75">0.75x</button>
          <button class="speed-btn active" data-speed="1.0">1.0x</button>
          <button class="speed-btn" data-speed="1.25">1.25x</button>
        </div>
      </div>
      <div id="recogNotice" class="notice" style="display:none; text-align:left;"></div>
      <button class="btn btn-record" id="recordBtn" style="margin-bottom:0.75rem;">🎙️ 発音チェック（話してテスト）</button>
      <div id="speechResultBox" class="answer-box" style="text-align:center; background:#ecfdf5; border:1px solid #6ee7b7;">
        <div style="font-size:0.8rem; color:#047857;">聞き取った英語:</div>
        <div id="spokenText" style="font-size:1rem; font-weight:bold; color:#065f46; margin:0.25rem 0; min-height:1.5em;"></div>
        <div id="wordChips" class="word-chips"></div>
        <div id="matchScore" style="font-size:1.4rem; font-weight:bold; color:#047857; margin-top:0.25rem;"></div>
        <div id="matchRating" style="font-weight:bold; color:#059669; margin-top:0.25rem; font-size:0.9rem;"></div>
      </div>
      <button class="btn btn-secondary" id="showAnswerBtn" style="margin-top:0.75rem;">お手本の英文を表示</button>
      <div class="answer-box" id="answerArea" style="text-align:left;">
        <div style="font-size:0.85rem; color:#64748b;">お手本フレーズ:</div>
        <div id="modelAnswer" style="font-size:1.1rem; font-weight:bold; color:var(--primary); margin-top:0.25rem;"></div>
        <div id="modelNote" class="ex-text"></div>
        <div id="modelKana" class="kana-line"></div>
      </div>
      <button class="btn" id="nextBtn" style="margin-top:0.75rem;">次のフレーズへ ➔</button>
    </div>
  </div>

  <nav>
    <a href="index.html">🏠 ホーム</a>
    <a href="translator.html">💬 会話</a>
    <a href="plan.html">📅 予習</a>
    <a href="recap.html">📝 ふり返り</a>
    <a href="quiz.html" class="active" aria-current="page">✍️ 練習</a>
  </nav>
  <script src="common.js?v=15"></script>
  <script src="usage-data.js?v=5"></script>
  <script>
    const PASS_SCORE = 75;      // この点数以上で「言えた」と記録（苦手カウントを減らす）
    let currentItem = null, speechRate = 1.0, recognizer = null;

    function refreshFav() {
      const btn = document.getElementById('speakingFavBtn');
      const on = !!currentItem && EA.isFavorite(currentItem[1]);
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    function resetResult() {
      document.getElementById('speechResultBox').style.display = 'none';
      document.getElementById('answerArea').style.display = 'none';
      document.getElementById('showAnswerBtn').style.display = 'block';
    }

    // autoplay=true はボタン操作の直後だけ（iOSは操作なしの自動再生をブロックするため）
    function loadPrompt(autoplay) {
      if (recognizer && recognizer.listening) recognizer.abort();
      const select = document.getElementById('genreSelect');
      if (!EA.ensureNonEmpty(select)) return;
      const list = EA.getPhrasesFor(select.value);
      let next = list[Math.floor(Math.random() * list.length)];
      if (list.length > 1) { let guard = 0; while (currentItem && next[1] === currentItem[1] && guard++ < 10) next = list[Math.floor(Math.random() * list.length)]; }
      currentItem = next;
      document.getElementById('categoryLabel').textContent = currentItem[0];
      document.getElementById('promptText').textContent = '「' + EA.splitJa(currentItem[2]).main + '」を声に出して言いましょう！';
      resetResult();
      refreshFav();
      if (autoplay) EA.autoSpeak(currentItem[1], 'en-US', speechRate);
    }

    function setRecordingUI(on) {
      const btn = document.getElementById('recordBtn');
      btn.classList.toggle('recording', on);
      btn.textContent = on ? '⏹ 聞き取り中…（話し終えたらタップ）' : '🎙️ 発音チェック（話してテスト）';
    }

    function showRecogError(msg) {
      const box = document.getElementById('recogNotice');
      box.className = 'notice error';
      box.textContent = msg;
      box.style.display = 'block';
    }

    function renderScore(result) {
      const chips = document.getElementById('wordChips');
      chips.innerHTML = '';
      result.words.forEach(w => { const s = document.createElement('span'); s.className = 'word-chip ' + w.status; s.textContent = w.text; chips.appendChild(s); });
      document.getElementById('matchScore').textContent = 'スコア ' + result.score + ' 点';
      const s = result.score;
      document.getElementById('matchRating').textContent =
        s >= 90 ? '🌟 Excellent! ネイティブに近い発音です' :
        s >= 75 ? '👍 Good! とても伝わる発音です' :
        s >= 50 ? '💪 もう一息！赤い単語をお手本で確認してみましょう' :
        '🔁 もう一度！お手本をゆっくり（0.75x）で聞いてから挑戦してみましょう';
    }

    function setupRecognizer() {
      const notice = document.getElementById('recogNotice');
      if (!EA.recognitionSupported) {
        notice.className = 'notice';
        notice.textContent = 'このブラウザは音声認識に対応していません。iPhoneはSafari、AndroidやPCはChromeでお試しください（ホーム画面に追加したアプリ内では動かない場合があります）。';
        notice.style.display = 'block';
        document.getElementById('recordBtn').disabled = true;
        return;
      }
      recognizer = EA.createRecognizer({
        lang: 'en-US',
        onState: setRecordingUI,
        onInterim: text => { document.getElementById('spokenText').textContent = text; },
        onFinal: alts => {
          if (!currentItem) return;
          const result = EA.bestMatch(currentItem[1], alts);
          document.getElementById('spokenText').textContent = result.text;
          renderScore(result);
          EA.countSpeak();
          EA.recordResult(currentItem, result.score >= PASS_SCORE);
          EA.updateStreakBadge();
        },
        onError: msg => {
          showRecogError(msg);
          document.getElementById('speechResultBox').style.display = 'none';
        }
      });
    }

    function toggleRecording() {
      if (!recognizer || !currentItem) return;
      if (recognizer.listening) { recognizer.stop(); return; }
      document.getElementById('recogNotice').style.display = 'none';
      document.getElementById('spokenText').textContent = '';
      document.getElementById('wordChips').innerHTML = '';
      document.getElementById('matchScore').textContent = '';
      document.getElementById('matchRating').textContent = '';
      document.getElementById('speechResultBox').style.display = 'block';
      recognizer.start();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('genreSelect');
      EA.populateGenreSelect(select);
      loadPrompt(false);
      setupRecognizer();
      select.addEventListener('change', () => loadPrompt(true));
      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          speechRate = parseFloat(btn.dataset.speed);
          if (currentItem) EA.speak(currentItem[1], 'en-US', speechRate);
        });
      });
      document.getElementById('playNativeBtn').addEventListener('click', () => { if (currentItem) EA.speak(currentItem[1], 'en-US', speechRate); });
      document.getElementById('recordBtn').addEventListener('click', toggleRecording);
      document.getElementById('showAnswerBtn').addEventListener('click', () => {
        if (!currentItem) return;
        EA.markStudied(currentItem);
        EA.updateStreakBadge();
        document.getElementById('modelAnswer').textContent = currentItem[1];
        const { note } = EA.splitJa(currentItem[2]);
        document.getElementById('modelNote').textContent = [note ? '💡 ' + note : '', currentItem[3] ? '例文: ' + currentItem[3] : ''].filter(Boolean).join('  /  ');
      EA.renderUsage(document.getElementById('modelNote'), currentItem[1]);
        EA.renderKana(document.getElementById('modelKana'), currentItem[1]);
        document.getElementById('answerArea').style.display = 'block';
        document.getElementById('showAnswerBtn').style.display = 'none';
      });
      document.getElementById('nextBtn').addEventListener('click', () => loadPrompt(true));
      document.getElementById('speakingFavBtn').addEventListener('click', () => { if (currentItem) { EA.toggleFavorite(currentItem[1]); refreshFav(); } });
    });

  </script>
</body>
</html>
