<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Learning App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .section {
            margin-bottom: 25px;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        .card {
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            background-color: #fafafa;
            margin-top: 10px;
        }
        .word {
            font-size: 1.4em;
            font-weight: bold;
            color: #2c3e50;
        }
        .meaning {
            font-size: 1.1em;
            color: #555;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>英単語学習 App</h1>
        
        <div class="section">
            <h2>単語検索</h2>
            <input type="text" id="searchInput" placeholder="単語または意味を入力...">
            <button onclick="searchWord()">検索</button>
            <div id="searchResult"></div>
        </div>

        <div class="section">
            <h2>新しい単語を追加</h2>
            <input type="text" id="newWord" placeholder="英単語 (例: apple)">
            <input type="text" id="newMeaning" placeholder="意味 (例: りんご)">
            <button onclick="addWord()">追加</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
